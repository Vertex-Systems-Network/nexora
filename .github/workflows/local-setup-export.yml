name: Temporary local setup source export
on:
  push:
    branches:
      - codex/portable-host-setup-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exact tracked source without secrets
        run: |
          git archive --format=tar HEAD | gzip -9 > ./nexora-source.tar.gz
          sha256sum ./nexora-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-source-portable-export
          path: nexora-source.tar.gz
          retention-days: 2

  runtime-deps-export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo, mbstring, openssl, pdo, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked PHP and Node dependencies and build assets
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund
          npm run build
          tar -czf nexora-runtime-deps.tar.gz vendor public/build
          sha256sum nexora-runtime-deps.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-runtime-deps-export
          path: nexora-runtime-deps.tar.gz
          retention-days: 2

  debian-extension-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch Debian 13 PHP 8.4 extension packages for offline target
        run: |
          mkdir -p php-ext-packages
          docker run --rm -v "$PWD/php-ext-packages:/out" debian:trixie bash -euxc '
            apt-get update -qq
            cd /tmp
            apt-get download php8.4-mbstring php8.4-zip php8.4-sqlite3 php8.4-xml php8.4-curl
            cp ./*.deb /out/
          '
          ls -lh php-ext-packages
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-debian-php-extensions
          path: php-ext-packages/*.deb
          retention-days: 2
