name: Nexora N1.11 Customer Portal CRM Membership target QA

on:
  pull_request:
    branches:
      - dev/n1-0b-core-functional-qa

permissions:
  contents: read

jobs:
  n111-target:
    name: n111-target
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BASE_URL: http://127.0.0.1:8000
      EVIDENCE_DIR: storage/app/nexora/qa/n111-target

    steps:
      - name: Checkout exact governed development source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          clean: true
          fetch-depth: 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, zip
          ini-values: memory_limit=512M, post_max_size=64M, upload_max_filesize=64M, max_execution_time=120, max_input_time=60, max_input_vars=3000, max_file_uploads=20
          coverage: none
          tools: composer:v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Guard source and prepare disposable target
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (& git rev-parse HEAD).Trim()
          $expected = '${{ github.event.pull_request.base.sha }}'
          $frozen = '2f5eb3b9dcf1c146f4e647fb3441318c4bf2c829'
          if ($source -ne $expected) { throw 'N1.11 checkout is not bound to the exact PR base SHA.' }
          if ($expected -ne $frozen) { throw "N1.11 acceptance was frozen against $frozen, not $expected." }

          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          $phpVersion = (& php -r "echo PHP_VERSION;").Trim()
          $composerVersion = (& composer --version --no-ansi).Trim()
          $nodeVersion = (& node -p "process.versions.node").Trim()
          $npmVersion = (& npm.cmd --version).Trim()

          & composer install --no-interaction --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm.cmd install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm.cmd run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dbNative = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'nexora-n111.sqlite'))
          $db = $dbNative.Replace('\', '/')
          if (Test-Path $dbNative) { Remove-Item -Force $dbNative }
          New-Item -ItemType File -Path $dbNative | Out-Null
          $key = (& php -r "echo 'base64:'.base64_encode(random_bytes(32));").Trim()
          @"
          APP_NAME="Nexora N1.11 QA"
          APP_ENV=production
          APP_KEY=$key
          APP_DEBUG=false
          APP_URL=$env:BASE_URL
          APP_LOCALE=en
          LOG_CHANNEL=stderr
          DB_CONNECTION=sqlite
          DB_DATABASE=$db
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          NEXORA_INSTALLER_BYPASS=false
          "@ | Set-Content -Encoding UTF8 .env
          $db | Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP 'n111-database-path.txt')

          @{
            schema = 1
            evidence_kind = 'n1.11-customer-portal-crm-membership-real-target'
            source_sha = $source
            expected_source_sha = $expected
            carrier_sha = '${{ github.event.pull_request.head.sha }}'
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            php = $phpVersion
            composer = $composerVersion
            node = $nodeVersion
            npm = $npmVersion
            base_url = $env:BASE_URL
            helpdesk_certified = $false
            portal_200_certified = $false
            external_provider_certified = $false
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'source-binding.json')

      - name: Commit real disposable install and reconcile runtime
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $serverOut = Join-Path $env:EVIDENCE_DIR 'install-server.out.log'
          $serverErr = Join-Path $env:EVIDENCE_DIR 'install-server.err.log'
          $docroot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'public'))
          $router = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php'))
          $server = Start-Process -FilePath 'php' -ArgumentList @('-S','127.0.0.1:8000','-t',$docroot,$router) -WorkingDirectory $docroot -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($server.HasExited) { throw "Installer server exited early with code $($server.ExitCode)." }
              $probe = (& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/install").Trim()
              if (($LASTEXITCODE -eq 0) -and ($probe -eq '200')) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Disposable installer did not serve /install with HTTP 200.' }

            $cookies = Join-Path $env:RUNNER_TEMP 'n111-install-cookies.txt'
            $htmlPath = Join-Path $env:RUNNER_TEMP 'n111-install.html'
            & curl.exe -sS -c $cookies "$env:BASE_URL/install" -o $htmlPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $html = Get-Content -Raw $htmlPath
            $csrfMatch = [regex]::Match($html, 'name="_token"\s+value="([^"]+)"')
            if (-not $csrfMatch.Success) { throw 'Unable to extract installer CSRF token.' }
            $csrf = $csrfMatch.Groups[1].Value
            $db = (Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'n111-database-path.txt')).Trim()
            $password = 'Nx!'+[guid]::NewGuid().ToString('N')+'Aa1'

            $headers = Join-Path $env:RUNNER_TEMP 'n111-install.headers.txt'
            $body = Join-Path $env:RUNNER_TEMP 'n111-install.body.html'
            $status = (& curl.exe -sS -b $cookies -c $cookies -D $headers -o $body -w '%{http_code}' -X POST "$env:BASE_URL/install" `
              --data-urlencode "_token=$csrf" `
              --data-urlencode 'app_name=Nexora N1.11 QA' `
              --data-urlencode "app_url=$env:BASE_URL" `
              --data-urlencode 'language=en' `
              --data-urlencode 'db_driver=sqlite' `
              --data-urlencode "db_database=$db" `
              --data-urlencode 'db_create=1' `
              --data-urlencode 'admin_name=N1.11 QA Administrator' `
              --data-urlencode 'admin_email=n111-admin@example.test' `
              --data-urlencode "admin_password=$password" `
              --data-urlencode "admin_password_confirmation=$password" `
              --data-urlencode 'terms=1').Trim()
            if ($status -ne '302') { throw "Installer commit failed; HTTP $status." }
            $location = ([regex]::Match((Get-Content -Raw $headers), '(?im)^Location:\s*(\S+)\s*$')).Groups[1].Value
            if ($location -notmatch '/install/runtime-handoff$') { throw "Installer redirect was unexpected: $location" }
            if (-not (Test-Path 'storage/app/nexora/installed.lock')) { throw 'Installer did not seal installed.lock.' }
            @{ install_http = [int]$status; install_location = '/install/runtime-handoff'; installed_lock = $true } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'install-result.json')
          }
          finally {
            & cmd.exe /d /c "taskkill /PID $($server.Id) /T /F >NUL 2>&1 || exit /b 0" | Out-Null
          }

          & php artisan nexora:runtime:post-install-reconcile --confirm=RECONCILE
          if ($LASTEXITCODE -ne 0) { throw 'Guarded post-install reconcile failed on disposable N1.11 target.' }
          & php artisan optimize:clear
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ reconciled = $true; installed_lock = (Test-Path 'storage/app/nexora/installed.lock') } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'runtime-result.json')

      - name: Run frozen N1.11 contracts on target toolchain
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & php scripts/customer-portal-product-contract-verify.php 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE_DIR 'customer-portal-product-contract.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Customer Portal product contract verifier failed.' }
          & php scripts/crm-membership-product-contract-verify.php 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE_DIR 'crm-membership-product-contract.txt')
          if ($LASTEXITCODE -ne 0) { throw 'CRM + Membership product contract verifier failed.' }

          $testDbNative = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'nexora-n111-contract-tests.sqlite'))
          if (Test-Path $testDbNative) { Remove-Item -Force $testDbNative }
          New-Item -ItemType File -Path $testDbNative | Out-Null
          $env:DB_CONNECTION = 'sqlite'
          $env:DB_DATABASE = $testDbNative.Replace('\', '/')
          $env:APP_ENV = 'testing'
          $env:NEXORA_INSTALLER_BYPASS = 'true'
          & php artisan test tests/Feature/Portal/CustomerPortalFlowTest.php tests/Feature/Crm/CrmMembershipTenantIsolationTest.php --display-warnings --fail-on-warning 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE_DIR 'n111-contract-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw "Frozen N1.11 executable contract failed with exit $LASTEXITCODE." }
          @{ verifiers = 'pass'; frozen_feature_tests = 'pass'; database = 'disposable-sqlite' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'contract-result.json')

      - name: Seed and prove installed-target tenant state
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:DB_CONNECTION -ErrorAction SilentlyContinue
          Remove-Item Env:DB_DATABASE -ErrorAction SilentlyContinue
          Remove-Item Env:APP_ENV -ErrorAction SilentlyContinue
          Remove-Item Env:NEXORA_INSTALLER_BYPASS -ErrorAction SilentlyContinue
          & php artisan optimize:clear
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $probe = Join-Path $env:RUNNER_TEMP 'n111-target-state.php'
          @'
          <?php
          declare(strict_types=1);
          use App\Models\CommerceCustomer;
          use App\Models\CrmCommerceLink;
          use App\Models\CrmContact;
          use App\Models\CrmLead;
          use App\Models\CrmPipeline;
          use App\Models\EnterpriseOrganization;
          use App\Models\EnterpriseOrganizationMember;
          use App\Models\Membership;
          use App\Models\MembershipPlan;
          use App\Models\Role;
          use App\Models\User;
          use App\Nexora\Crm\Contracts\CrmCommerceLinkContract;
          use App\Nexora\Crm\Services\CrmLeadConversionService;
          use App\Nexora\Enterprise\Services\TenantContext;
          use App\Nexora\Enterprise\Services\TenantMemberDirectory;
          use App\Nexora\Membership\Contracts\MembershipManagerContract;
          use Illuminate\Contracts\Console\Kernel;
          use Illuminate\Support\Facades\Hash;
          use Throwable;

          $root = (string) $argv[1];
          require $root.'/vendor/autoload.php';
          $app = require $root.'/bootstrap/app.php';
          $app->make(Kernel::class)->bootstrap();
          $context = app(TenantContext::class);
          $primary = EnterpriseOrganization::query()->where('is_default', true)->firstOrFail();
          $other = EnterpriseOrganization::query()->create([
              'name' => 'N1.11 Other Organization', 'slug' => 'n111-other-org', 'status' => 'active',
              'is_default' => false, 'timezone' => 'UTC', 'locale' => 'en',
          ]);
          $roleId = Role::query()->where('slug', 'user')->value('id');
          $makeUser = static function (string $name, string $email) use ($roleId): User {
              $u = User::query()->create([
                  'name' => $name, 'email' => $email, 'password' => Hash::make('N111-Portal-Password!1'),
                  'email_verified_at' => now(), 'status' => 'active',
              ]);
              if ($roleId) $u->roles()->attach($roleId);
              return $u;
          };
          $portal = $makeUser('N1.11 Portal User', 'n111-portal@example.test');
          $otherUser = $makeUser('N1.11 Other User', 'n111-other@example.test');
          EnterpriseOrganizationMember::query()->create(['organization_id'=>$primary->id,'user_id'=>$portal->id,'role'=>'member','status'=>'active','joined_at'=>now()]);
          EnterpriseOrganizationMember::query()->create(['organization_id'=>$other->id,'user_id'=>$otherUser->id,'role'=>'member','status'=>'active','joined_at'=>now()]);

          $context->set($primary);
          $customer = CommerceCustomer::query()->create(['user_id'=>$portal->id,'name'=>'N1.11 Portal Customer','email'=>'n111-portal-customer@example.test']);
          $contact = CrmContact::query()->create(['first_name'=>'N1.11','display_name'=>'N1.11 Primary Contact','email'=>'n111-contact@example.test','lifecycle_stage'=>'customer']);
          $link = app(CrmCommerceLinkContract::class)->link($customer, $contact);
          $plan = MembershipPlan::query()->create(['name'=>'N1.11 Portal Plan','slug'=>'n111-shared-plan','status'=>'active','metadata'=>[]]);
          Membership::query()->create(['plan_id'=>$plan->id,'user_id'=>$portal->id,'commerce_customer_id'=>$customer->id,'status'=>'active','started_at'=>now(),'metadata'=>[]]);
          CrmPipeline::query()->create(['name'=>'N1.11 Shared Pipeline','slug'=>'n111-shared-pipeline','is_default'=>false,'active'=>true]);

          $context->set($other);
          $otherCustomer = CommerceCustomer::query()->create(['user_id'=>$otherUser->id,'name'=>'N1.11 Other Customer','email'=>'n111-other-customer@example.test']);
          $otherContact = CrmContact::query()->create(['first_name'=>'Other','display_name'=>'N1.11 Other Contact','email'=>'n111-other-contact@example.test','lifecycle_stage'=>'customer']);
          $otherPlan = MembershipPlan::query()->create(['name'=>'N1.11 Other Plan','slug'=>'n111-shared-plan','status'=>'active','metadata'=>[]]);
          Membership::query()->create(['plan_id'=>$otherPlan->id,'user_id'=>$otherUser->id,'commerce_customer_id'=>$otherCustomer->id,'status'=>'active','started_at'=>now(),'metadata'=>[]]);
          $otherPipeline = CrmPipeline::query()->create(['name'=>'N1.11 Other Shared Pipeline','slug'=>'n111-shared-pipeline','is_default'=>false,'active'=>true]);

          $context->set($primary);
          $crmCrossTenantRejected = false; $membershipCrossTenantRejected = false; $leadPipelineRejected = false;
          $crmMessage = ''; $membershipMessage = ''; $leadMessage = '';
          try { app(CrmCommerceLinkContract::class)->link($customer, $otherContact); } catch (Throwable $e) { $crmCrossTenantRejected = true; $crmMessage = $e->getMessage(); }
          try { app(MembershipManagerContract::class)->grant($plan, null, ['commerce_customer_id'=>$otherCustomer->id,'status'=>'active']); } catch (Throwable $e) { $membershipCrossTenantRejected = true; $membershipMessage = $e->getMessage(); }
          $lead = CrmLead::query()->create(['title'=>'N1.11 Primary Lead','status'=>'qualified','score'=>80,'currency'=>'USD','estimated_value_minor'=>10000]);
          try { app(CrmLeadConversionService::class)->convert($lead, $otherPipeline); } catch (Throwable $e) { $leadPipelineRejected = true; $leadMessage = $e->getMessage(); }
          $directoryIds = array_map('strval', array_column(app(TenantMemberDirectory::class)->options(), 'id'));
          $state = [
              'primary_tenant_id'=>$primary->id,
              'other_tenant_id'=>$other->id,
              'portal_user_id'=>$portal->id,
              'other_user_id'=>$otherUser->id,
              'portal_customer_id'=>$customer->id,
              'portal_membership_count'=>Membership::query()->where('user_id',$portal->id)->count(),
              'primary_visible_crm_links'=>CrmCommerceLink::query()->count(),
              'duplicate_plan_slug_across_tenants'=>MembershipPlan::query()->withoutGlobalScope('nexora_tenant')->where('slug','n111-shared-plan')->count(),
              'duplicate_pipeline_slug_across_tenants'=>CrmPipeline::query()->withoutGlobalScope('nexora_tenant')->where('slug','n111-shared-pipeline')->count(),
              'directory_contains_primary'=>in_array((string)$portal->id,$directoryIds,true),
              'directory_excludes_other'=>!in_array((string)$otherUser->id,$directoryIds,true),
              'crm_cross_tenant_rejected'=>$crmCrossTenantRejected,
              'crm_rejection_message'=>$crmMessage,
              'membership_cross_tenant_rejected'=>$membershipCrossTenantRejected,
              'membership_rejection_message'=>$membershipMessage,
              'lead_pipeline_cross_tenant_rejected'=>$leadPipelineRejected,
              'lead_pipeline_rejection_message'=>$leadMessage,
              'linked_crm_contact_id'=>$link->crm_contact_id,
          ];
          if (!$crmCrossTenantRejected || !$membershipCrossTenantRejected || !$leadPipelineRejected || !$state['directory_contains_primary'] || !$state['directory_excludes_other'] || $state['duplicate_plan_slug_across_tenants'] !== 2 || $state['duplicate_pipeline_slug_across_tenants'] !== 2) {
              fwrite(STDERR, json_encode($state, JSON_PRETTY_PRINT).PHP_EOL); exit(2);
          }
          echo json_encode($state, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES).PHP_EOL;
          '@ | Set-Content -Encoding UTF8 $probe
          & php $probe $env:GITHUB_WORKSPACE | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'tenant-state.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed-target CRM/Membership state probe failed.' }

      - name: Exercise Customer Portal over real HTTP
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $serverOut = Join-Path $env:EVIDENCE_DIR 'portal-server.out.log'
          $serverErr = Join-Path $env:EVIDENCE_DIR 'portal-server.err.log'
          $docroot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'public'))
          $router = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php'))
          $server = Start-Process -FilePath 'php' -ArgumentList @('-S','127.0.0.1:8000','-t',$docroot,$router) -WorkingDirectory $docroot -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              if ($server.HasExited) { throw "Portal server exited early with code $($server.ExitCode)." }
              $probe = (& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/login").Trim()
              if (($LASTEXITCODE -eq 0) -and ($probe -eq '200')) { break }
              Start-Sleep -Seconds 1
            }

            $guestHeaders = Join-Path $env:RUNNER_TEMP 'n111-guest.headers.txt'
            $guestStatus = (& curl.exe -sS -D $guestHeaders -o NUL -w '%{http_code}' "$env:BASE_URL/account").Trim()
            $guestLocation = ([regex]::Match((Get-Content -Raw $guestHeaders), '(?im)^Location:\s*(\S+)\s*$')).Groups[1].Value
            if ($guestStatus -ne '302' -or $guestLocation -notmatch '/login$') { throw "Guest portal boundary failed: HTTP $guestStatus -> $guestLocation" }

            $cookies = Join-Path $env:RUNNER_TEMP 'n111-portal-cookies.txt'
            $loginPage = Join-Path $env:RUNNER_TEMP 'n111-login.html'
            & curl.exe -sS -c $cookies "$env:BASE_URL/login" -o $loginPage
            $html = Get-Content -Raw $loginPage
            $csrf = ([regex]::Match($html, 'name="_token"\s+value="([^"]+)"')).Groups[1].Value
            if (-not $csrf) { throw 'Unable to extract login CSRF token.' }
            $loginHeaders = Join-Path $env:RUNNER_TEMP 'n111-login.headers.txt'
            $loginStatus = (& curl.exe -sS -b $cookies -c $cookies -D $loginHeaders -o NUL -w '%{http_code}' -X POST "$env:BASE_URL/login" `
              --data-urlencode "_token=$csrf" `
              --data-urlencode 'email=n111-portal@example.test' `
              --data-urlencode 'password=N111-Portal-Password!1').Trim()
            $loginLocation = ([regex]::Match((Get-Content -Raw $loginHeaders), '(?im)^Location:\s*(\S+)\s*$')).Groups[1].Value
            if ($loginStatus -ne '302' -or $loginLocation -notmatch '/account$') { throw "Standard-user login destination failed: HTTP $loginStatus -> $loginLocation" }

            $portalBody = Join-Path $env:RUNNER_TEMP 'n111-account.html'
            $portalStatus = (& curl.exe -sS -b $cookies -c $cookies -o $portalBody -w '%{http_code}' "$env:BASE_URL/account").Trim()
            if ($portalStatus -ne '200') { throw "Authenticated /account failed with HTTP $portalStatus." }
            $account = Get-Content -Raw $portalBody
            $hasCustomer = $account.Contains('n111-portal-customer@example.test')
            $hasPlan = $account.Contains('N1.11 Portal Plan')
            $leaksOtherCustomer = $account.Contains('n111-other-customer@example.test')
            $leaksOtherPlan = $account.Contains('N1.11 Other Plan')
            if (-not $hasCustomer -or -not $hasPlan -or $leaksOtherCustomer -or $leaksOtherPlan) { throw 'Portal HTTP response did not preserve explicit current-user isolation.' }

            $adminStatus = (& curl.exe -sS -b $cookies -o NUL -w '%{http_code}' "$env:BASE_URL/admin").Trim()
            if ($adminStatus -ne '403') { throw "Standard portal user /admin boundary expected 403, got $adminStatus." }

            @{
              guest_account_http = [int]$guestStatus
              guest_account_location = '/login'
              login_http = [int]$loginStatus
              login_location = '/account'
              account_http = [int]$portalStatus
              linked_customer_visible = $hasCustomer
              linked_membership_visible = $hasPlan
              other_customer_disclosed = $leaksOtherCustomer
              other_membership_disclosed = $leaksOtherPlan
              admin_http = [int]$adminStatus
            } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'http-boundary.json')
          }
          finally {
            & cmd.exe /d /c "taskkill /PID $($server.Id) /T /F >NUL 2>&1 || exit /b 0" | Out-Null
          }

      - name: Write N1.11 evidence summary
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $binding = Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'source-binding.json') | ConvertFrom-Json
          $install = Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'install-result.json') | ConvertFrom-Json
          $runtime = Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'runtime-result.json') | ConvertFrom-Json
          $http = Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'http-boundary.json') | ConvertFrom-Json
          $state = Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'tenant-state.json') | ConvertFrom-Json
          @{
            schema = 1
            acceptance = 'N1.11 Customer Portal / CRM / Membership'
            status = 'pass'
            source_sha = $binding.source_sha
            carrier_sha = $binding.carrier_sha
            install = $install
            reconcile = $runtime
            frozen_contracts = 'pass'
            http = $http
            tenant_state = $state
            exclusions = @('Helpdesk','PORTAL-200 expansion','external providers/connectors','remaining five-engine DB matrix','N1.12+','HA/recovery/C5/C6/final release')
          } | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'summary.json')

      - name: Upload N1.11 target evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexora-n111-target-${{ github.event.pull_request.base.sha }}-${{ github.run_id }}
          path: storage/app/nexora/qa/n111-target
          if-no-files-found: error
          retention-days: 14
