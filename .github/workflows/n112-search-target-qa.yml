name: Nexora N1.12 Search 2.0 target QA

on:
  pull_request:
    branches:
      - dev/n1-0b-core-functional-qa

permissions:
  contents: read

jobs:
  n112-target:
    name: n112-target
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BASE_URL: http://127.0.0.1:8000
      EVIDENCE_DIR: storage/app/nexora/qa/n112-target

    steps:
      - name: Checkout exact governed development source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          clean: true
          fetch-depth: 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, zip
          ini-values: memory_limit=512M, post_max_size=64M, upload_max_filesize=64M, max_execution_time=120, max_input_time=60, max_input_vars=3000, max_file_uploads=20
          coverage: none
          tools: composer:v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Guard source and prepare disposable target
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (& git rev-parse HEAD).Trim()
          $expected = '${{ github.event.pull_request.base.sha }}'
          $frozen = '78976e9f44e290155b119ae722a77fb37fd59018'
          if ($source -ne $expected) { throw 'N1.12 checkout is not bound to the exact PR base SHA.' }
          if ($expected -ne $frozen) { throw "N1.12 acceptance was frozen against $frozen, not $expected." }

          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          $phpVersion = (& php -r "echo PHP_VERSION;").Trim()
          $composerVersion = (& composer --version --no-ansi).Trim()
          $nodeVersion = (& node -p "process.versions.node").Trim()
          $npmVersion = (& npm.cmd --version).Trim()

          & composer install --no-interaction --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm.cmd install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm.cmd run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dbNative = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'nexora-n112.sqlite'))
          $db = $dbNative.Replace('\', '/')
          if (Test-Path $dbNative) { Remove-Item -Force $dbNative }
          New-Item -ItemType File -Path $dbNative | Out-Null
          $key = (& php -r "echo 'base64:'.base64_encode(random_bytes(32));").Trim()
          @"
          APP_NAME="Nexora N1.12 QA"
          APP_ENV=production
          APP_KEY=$key
          APP_DEBUG=false
          APP_URL=$env:BASE_URL
          APP_LOCALE=en
          LOG_CHANNEL=stderr
          DB_CONNECTION=sqlite
          DB_DATABASE=$db
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          NEXORA_INSTALLER_BYPASS=false
          "@ | Set-Content -Encoding UTF8 .env
          $db | Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP 'n112-database-path.txt')

          @{
            schema = 1
            evidence_kind = 'n1.12-search-2.0-bounded-real-target'
            source_sha = $source
            expected_source_sha = $expected
            carrier_sha = '${{ github.event.pull_request.head.sha }}'
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            php = $phpVersion
            composer = $composerVersion
            node = $nodeVersion
            npm = $npmVersion
            base_url = $env:BASE_URL
            implementation = 'database-backed-derived-index'
            resource_types = @('document','media')
            external_search_provider_certified = $false
            distributed_index_certified = $false
            facets_certified = $false
            performance_scale_certified = $false
            five_engine_matrix_certified = $false
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'source-binding.json')

      - name: Commit real disposable install and reconcile runtime
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $serverOut = Join-Path $env:EVIDENCE_DIR 'install-server.out.log'
          $serverErr = Join-Path $env:EVIDENCE_DIR 'install-server.err.log'
          $docroot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'public'))
          $router = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php'))
          $server = Start-Process -FilePath 'php' -ArgumentList @('-S','127.0.0.1:8000','-t',$docroot,$router) -WorkingDirectory $docroot -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($server.HasExited) { throw "Installer server exited early with code $($server.ExitCode)." }
              $probe = (& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/install").Trim()
              if (($LASTEXITCODE -eq 0) -and ($probe -eq '200')) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Disposable installer did not serve /install with HTTP 200.' }

            $cookies = Join-Path $env:RUNNER_TEMP 'n112-install-cookies.txt'
            $htmlPath = Join-Path $env:RUNNER_TEMP 'n112-install.html'
            & curl.exe -sS -c $cookies "$env:BASE_URL/install" -o $htmlPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $html = Get-Content -Raw $htmlPath
            $csrfMatch = [regex]::Match($html, 'name="_token"\s+value="([^"]+)"')
            if (-not $csrfMatch.Success) { throw 'Unable to extract installer CSRF token.' }
            $csrf = $csrfMatch.Groups[1].Value
            $db = (Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'n112-database-path.txt')).Trim()
            $password = 'Nx!'+[guid]::NewGuid().ToString('N')+'Aa1'

            $headers = Join-Path $env:RUNNER_TEMP 'n112-install.headers.txt'
            $body = Join-Path $env:RUNNER_TEMP 'n112-install.body.html'
            $status = (& curl.exe -sS -b $cookies -c $cookies -D $headers -o $body -w '%{http_code}' -X POST "$env:BASE_URL/install" `
              --data-urlencode "_token=$csrf" `
              --data-urlencode 'app_name=Nexora N1.12 QA' `
              --data-urlencode "$([string]'app_url=')$env:BASE_URL" `
              --data-urlencode 'language=en' `
              --data-urlencode 'db_driver=sqlite' `
              --data-urlencode "db_database=$db" `
              --data-urlencode 'db_create=1' `
              --data-urlencode 'admin_name=N1.12 Installer Administrator' `
              --data-urlencode 'admin_email=n112-installer-admin@example.test' `
              --data-urlencode "admin_password=$password" `
              --data-urlencode "admin_password_confirmation=$password" `
              --data-urlencode 'terms=1').Trim()
            if ($status -ne '302') { throw "Installer commit failed; HTTP $status." }
            $location = ([regex]::Match((Get-Content -Raw $headers), '(?im)^Location:\s*(\S+)\s*$')).Groups[1].Value
            if ($location -notmatch '/install/runtime-handoff$') { throw "Installer redirect was unexpected: $location" }
            if (-not (Test-Path 'storage/app/nexora/installed.lock')) { throw 'Installer did not seal installed.lock.' }
            @{ install_http = [int]$status; install_location = '/install/runtime-handoff'; installed_lock = $true } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'install-result.json')
          }
          finally {
            & cmd.exe /d /c "taskkill /PID $($server.Id) /T /F >NUL 2>&1 || exit /b 0" | Out-Null
          }

          & php artisan nexora:runtime:post-install-reconcile --confirm=RECONCILE 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE_DIR 'post-install-reconcile.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Guarded post-install reconcile failed on disposable N1.12 target.' }
          & php artisan optimize:clear
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ reconciled = $true; installed_lock = (Test-Path 'storage/app/nexora/installed.lock') } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'runtime-result.json')

      - name: Run frozen Search contracts on target toolchain
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & php scripts/search-product-contract-verify.php 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE_DIR 'search-product-contract.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Search 2.0 product contract verifier failed.' }

          $testDbNative = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'nexora-n112-contract-tests.sqlite'))
          if (Test-Path $testDbNative) { Remove-Item -Force $testDbNative }
          New-Item -ItemType File -Path $testDbNative | Out-Null
          $env:DB_CONNECTION = 'sqlite'
          $env:DB_DATABASE = $testDbNative.Replace('\', '/')
          $env:APP_ENV = 'testing'
          $env:NEXORA_INSTALLER_BYPASS = 'true'
          & php artisan test tests/Feature/Discovery/SearchProductIsolationTest.php --display-warnings --fail-on-warning 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE_DIR 'search-isolation-tests.txt')
          if ($LASTEXITCODE -ne 0) { throw "Frozen N1.12 executable Search contract failed with exit $LASTEXITCODE." }
          @{ verifier = 'pass'; frozen_feature_tests = 'pass'; database = 'disposable-sqlite' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'contract-result.json')

      - name: Prove installed-target Search lifecycle and tenant state
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:DB_CONNECTION -ErrorAction SilentlyContinue
          Remove-Item Env:DB_DATABASE -ErrorAction SilentlyContinue
          Remove-Item Env:APP_ENV -ErrorAction SilentlyContinue
          Remove-Item Env:NEXORA_INSTALLER_BYPASS -ErrorAction SilentlyContinue
          & php artisan optimize:clear
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $probe = Join-Path $env:RUNNER_TEMP 'n112-target-state.php'
          @'
          <?php
          declare(strict_types=1);

          use App\Models\Document;
          use App\Models\EnterpriseOrganization;
          use App\Models\EnterpriseOrganizationMember;
          use App\Models\MediaAsset;
          use App\Models\MembershipAccessPolicy;
          use App\Models\Permission;
          use App\Models\Role;
          use App\Models\SearchIndexEntry;
          use App\Models\SeoEntry;
          use App\Models\User;
          use App\Nexora\Discovery\Search\SearchIndexer;
          use App\Nexora\Enterprise\Services\TenantContext;
          use App\Nexora\Enterprise\Services\TenantMemberDirectory;
          use App\Nexora\Foundation\Contracts\SettingsContract;
          use Illuminate\Contracts\Console\Kernel;
          use Illuminate\Support\Facades\Hash;
          use Illuminate\Support\Str;

          $root = (string) $argv[1];
          require $root.'/vendor/autoload.php';
          $app = require $root.'/bootstrap/app.php';
          $app->make(Kernel::class)->bootstrap();

          $context = app(TenantContext::class);
          $indexer = app(SearchIndexer::class);
          $settings = app(SettingsContract::class);
          $primary = EnterpriseOrganization::query()->where('is_default', true)->firstOrFail();
          $other = EnterpriseOrganization::query()->create([
              'name'=>'N1.12 Other Organization','slug'=>'n112-other-org','status'=>'active','is_default'=>false,'timezone'=>'UTC','locale'=>'en',
          ]);

          $makeRole = static function (string $slug, array $permissions): Role {
              $role = Role::query()->create(['name'=>$slug,'slug'=>$slug,'description'=>'N1.12 target QA role','is_system'=>false]);
              $ids = Permission::query()->whereIn('slug',$permissions)->pluck('id');
              $role->permissions()->sync($ids);
              return $role;
          };
          $adminRole = $makeRole('n112-search-admin',['admin.access','search.use','search.index.manage','documents.view','media.view','users.view']);
          $noSearchRole = $makeRole('n112-no-search',['admin.access','documents.view','media.view']);
          $noReindexRole = $makeRole('n112-no-reindex',['admin.access','search.use','documents.view','media.view','users.view']);
          $userRoleId = Role::query()->where('slug','user')->value('id');

          $makeUser = static function (string $name, string $email, string $password, ?Role $role = null) use ($userRoleId): User {
              $user = User::query()->create(['name'=>$name,'email'=>$email,'password'=>Hash::make($password),'status'=>'active']);
              $user->forceFill(['email_verified_at'=>now()])->save();
              if ($role) $user->roles()->attach($role->id); elseif ($userRoleId) $user->roles()->attach($userRoleId);
              return $user;
          };
          $admin = $makeUser('N1.12 Search Admin','n112-admin@example.test','N112-Admin-Password!1',$adminRole);
          $noSearch = $makeUser('N1.12 No Search','n112-no-search@example.test','N112-NoSearch-Password!1',$noSearchRole);
          $noReindex = $makeUser('N1.12 No Reindex','n112-no-reindex@example.test','N112-NoReindex-Password!1',$noReindexRole);
          $otherUser = $makeUser('N112Alpha Other Member','n112-other@example.test','N112-Other-Password!1');
          foreach ([$admin,$noSearch,$noReindex] as $user) {
              EnterpriseOrganizationMember::query()->create(['organization_id'=>$primary->id,'user_id'=>$user->id,'role'=>'member','status'=>'active','joined_at'=>now()]);
          }
          EnterpriseOrganizationMember::query()->create(['organization_id'=>$other->id,'user_id'=>$otherUser->id,'role'=>'member','status'=>'active','joined_at'=>now()]);

          $context->set($primary);
          $settings->set('search.public_enabled', true);
          $settings->set('analytics.enabled', true);
          $public = Document::query()->create([
              'uuid'=>(string)Str::uuid(),'type'=>'page','status'=>'published','title'=>'N112Alpha Primary Public','slug'=>'n112-alpha-public',
              'excerpt'=>'N112Alpha public excerpt','content'=>['blocks'=>[['type'=>'paragraph','data'=>['text'=>'N112Alpha searchable primary body']]]],
              'metadata'=>[],'schema_version'=>1,'published_at'=>now(),
          ]);
          $protected = Document::query()->create([
              'uuid'=>(string)Str::uuid(),'type'=>'page','status'=>'published','title'=>'N112Alpha Primary Protected','slug'=>'n112-alpha-protected',
              'excerpt'=>'N112Alpha protected excerpt','content'=>['blocks'=>[['type'=>'paragraph','data'=>['text'=>'N112Alpha protected body']]]],
              'metadata'=>[],'schema_version'=>1,'published_at'=>now(),
          ]);
          MembershipAccessPolicy::query()->create([
              'name'=>'N1.12 protected search fixture','resource_type'=>'document','resource_id'=>(string)$protected->id,
              'evaluation'=>'any','required_plan_ids'=>[],'required_entitlements'=>[],'unauthenticated_action'=>'deny','active'=>true,'metadata'=>[],
          ]);
          $media = MediaAsset::query()->create([
              'uuid'=>(string)Str::uuid(),'disk'=>'public','visibility'=>'public','media_type'=>'image','mime_type'=>'image/png','extension'=>'png',
              'original_name'=>'n112-alpha.png','stored_name'=>'n112-alpha.png','path'=>'n112/alpha-primary.png','size_bytes'=>32,
              'checksum_sha256'=>hash('sha256','n112-alpha-primary'),'title'=>'N112Alpha Primary Media','alt_text'=>'N112Alpha media alt','caption'=>'N112Alpha media caption','metadata'=>[],
          ]);

          $initialEntry = SearchIndexEntry::query()->where('resource_type','document')->where('resource_id',$public->id)->where('locale','en')->firstOrFail();
          $initialHash = (string)$initialEntry->content_hash;
          $public->title = 'N112Alpha Updated Primary';
          $public->content = ['blocks'=>[['type'=>'paragraph','data'=>['text'=>'N112Alpha updated canonical body']]]];
          $public->save();
          $updatedEntry = SearchIndexEntry::query()->where('resource_type','document')->where('resource_id',$public->id)->where('locale','en')->firstOrFail();
          $documentSingleProjection = SearchIndexEntry::query()->where('resource_type','document')->where('resource_id',$public->id)->where('locale','en')->count() === 1;
          $documentHashChanged = $initialHash !== (string)$updatedEntry->content_hash;

          $seo = SeoEntry::query()->create([
              'resource_type'=>'document','resource_id'=>$public->id,'locale'=>'en','seo_title'=>'N112 Alpha SEO','meta_description'=>'N112 Search QA',
              'url_path'=>'n112-custom-alpha','robots_index'=>true,'robots_follow'=>true,'schema_type'=>'WebPage','sitemap_include'=>true,'indexing_state'=>'eligible',
          ]);
          $seoUrlApplied = SearchIndexEntry::query()->where('resource_type','document')->where('resource_id',$public->id)->value('url_path') === '/n112-custom-alpha';

          $mediaIndexed = SearchIndexEntry::query()->where('resource_type','media')->where('resource_id',$media->id)->exists();
          $media->delete();
          $mediaRemoved = !SearchIndexEntry::query()->where('resource_type','media')->where('resource_id',$media->id)->exists();
          $media->restore();
          $mediaRestored = SearchIndexEntry::query()->where('resource_type','media')->where('resource_id',$media->id)->exists();

          SearchIndexEntry::query()->create([
              'resource_type'=>'document','resource_id'=>2147483001,'locale'=>'en','status'=>'published','title'=>'N112 diagnostic stale projection',
              'excerpt'=>null,'body_text'=>'diagnostic stale projection only','keywords'=>null,'url_path'=>'/n112-stale','content_hash'=>hash('sha256','n112-stale'),
              'published_at'=>now(),'indexed_at'=>now(),
          ]);
          $rebuildOne = $indexer->rebuild();
          $staleRemoved = !SearchIndexEntry::query()->where('resource_type','document')->where('resource_id',2147483001)->exists();
          $countAfterOne = SearchIndexEntry::query()->count();
          $rebuildTwo = $indexer->rebuild();
          $countAfterTwo = SearchIndexEntry::query()->count();
          $rebuildIdempotent = $countAfterOne === $countAfterTwo && SearchIndexEntry::query()->where('resource_type','document')->where('resource_id',$public->id)->where('locale','en')->count() === 1;

          $publicResults = $indexer->search('n112alpha', true, 20, 'en');
          $publicIds = $publicResults->pluck('resource_id')->map(fn($id)=>(int)$id)->all();
          $publicOnlyDocument = $publicResults->every(fn(array $row): bool => $row['resource_type'] === 'document');
          $publicVisible = in_array($public->id,$publicIds,true);
          $protectedHidden = !in_array($protected->id,$publicIds,true);
          $normalizedFinds = $indexer->search('  N112ALPHA   UPDATED  ', false, 20, 'en', ['document'])->contains(fn(array $row): bool => (int)$row['resource_id'] === $public->id);
          $shortQueryEmpty = $indexer->search('x',false,20,'en')->isEmpty();
          $invalidTypeEmpty = $indexer->search('n112alpha',false,20,'en',['unsupported'])->isEmpty();
          $limitClamped = $indexer->search('n112alpha',false,1,'en')->count() <= 1;

          $context->set($other);
          $otherDocument = Document::query()->create([
              'uuid'=>(string)Str::uuid(),'type'=>'page','status'=>'published','title'=>'N112Alpha Other Tenant','slug'=>'n112-alpha-other',
              'excerpt'=>'N112Alpha other tenant excerpt','content'=>['blocks'=>[['type'=>'paragraph','data'=>['text'=>'N112Alpha other tenant body']]]],
              'metadata'=>[],'schema_version'=>1,'published_at'=>now(),
          ]);
          $otherMedia = MediaAsset::query()->create([
              'uuid'=>(string)Str::uuid(),'disk'=>'public','visibility'=>'public','media_type'=>'image','mime_type'=>'image/png','extension'=>'png',
              'original_name'=>'n112-other.png','stored_name'=>'n112-other.png','path'=>'n112/alpha-other.png','size_bytes'=>32,
              'checksum_sha256'=>hash('sha256','n112-alpha-other'),'title'=>'N112Alpha Other Media','alt_text'=>'N112Alpha other media','metadata'=>[],
          ]);
          $otherResults = $indexer->search('n112alpha',false,20,'en');
          $otherIds = $otherResults->pluck('resource_id')->map(fn($id)=>(int)$id)->all();
          $otherSeesOwnDocument = in_array($otherDocument->id,$otherIds,true);
          $otherDoesNotSeePrimaryDocument = !in_array($public->id,$otherIds,true);

          $context->set($primary);
          $primaryResults = $indexer->search('n112alpha',false,50,'en');
          $primaryIds = $primaryResults->pluck('resource_id')->map(fn($id)=>(int)$id)->all();
          $primaryDoesNotSeeOtherDocument = !in_array($otherDocument->id,$primaryIds,true);
          $primaryDoesNotSeeOtherMedia = !in_array($otherMedia->id,$primaryIds,true);
          $directoryIds = array_map('strval',array_column(app(TenantMemberDirectory::class)->options(),'id'));
          $directoryExcludesOther = !in_array((string)$otherUser->id,$directoryIds,true);
          $allTenantIndexRows = SearchIndexEntry::query()->withoutGlobalScope('nexora_tenant')->count();
          $primaryIndexRows = SearchIndexEntry::query()->count();

          $state = [
              'primary_tenant_id'=>$primary->id,'other_tenant_id'=>$other->id,
              'primary_document_id'=>$public->id,'protected_document_id'=>$protected->id,'primary_media_id'=>$media->id,
              'other_document_id'=>$otherDocument->id,'other_media_id'=>$otherMedia->id,
              'document_single_projection'=>$documentSingleProjection,'document_hash_changed'=>$documentHashChanged,
              'seo_url_applied'=>$seoUrlApplied,'media_indexed'=>$mediaIndexed,'media_removed_on_delete'=>$mediaRemoved,'media_reindexed_on_restore'=>$mediaRestored,
              'diagnostic_stale_projection_fixture'=>true,'stale_projection_removed_by_rebuild'=>$staleRemoved,
              'first_rebuild'=>$rebuildOne,'second_rebuild'=>$rebuildTwo,'rebuild_idempotent'=>$rebuildIdempotent,
              'public_document_visible'=>$publicVisible,'protected_document_hidden'=>$protectedHidden,'public_results_document_only'=>$publicOnlyDocument,
              'normalized_query_finds_updated_document'=>$normalizedFinds,'short_query_empty'=>$shortQueryEmpty,'invalid_resource_type_empty'=>$invalidTypeEmpty,'limit_one_respected'=>$limitClamped,
              'other_tenant_sees_own_document'=>$otherSeesOwnDocument,'other_tenant_excludes_primary_document'=>$otherDoesNotSeePrimaryDocument,
              'primary_tenant_excludes_other_document'=>$primaryDoesNotSeeOtherDocument,'primary_tenant_excludes_other_media'=>$primaryDoesNotSeeOtherMedia,
              'primary_member_directory_excludes_other_tenant_user'=>$directoryExcludesOther,
              'primary_index_rows'=>$primaryIndexRows,'all_tenant_index_rows'=>$allTenantIndexRows,
              'qa_admin_email'=>'n112-admin@example.test','qa_no_search_email'=>'n112-no-search@example.test','qa_no_reindex_email'=>'n112-no-reindex@example.test',
          ];

          $required = [
              $documentSingleProjection,$documentHashChanged,$seoUrlApplied,$mediaIndexed,$mediaRemoved,$mediaRestored,$staleRemoved,$rebuildIdempotent,
              $publicVisible,$protectedHidden,$publicOnlyDocument,$normalizedFinds,$shortQueryEmpty,$invalidTypeEmpty,$limitClamped,
              $otherSeesOwnDocument,$otherDoesNotSeePrimaryDocument,$primaryDoesNotSeeOtherDocument,$primaryDoesNotSeeOtherMedia,$directoryExcludesOther,
              $allTenantIndexRows > $primaryIndexRows,
          ];
          if (in_array(false,$required,true)) { fwrite(STDERR,json_encode($state,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES).PHP_EOL); exit(2); }
          echo json_encode($state,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES).PHP_EOL;
          '@ | Set-Content -Encoding Ascii $probe
          & php $probe $env:GITHUB_WORKSPACE | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'search-state.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed-target Search lifecycle/tenant state probe failed.' }

      - name: Exercise Search over real HTTP and privacy boundaries
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:RUNNER_TEMP 'n112-http-helper.php'
          @'
          <?php
          declare(strict_types=1);
          use App\Models\AuditLog;
          use App\Models\EnterpriseOrganization;
          use App\Models\SearchQueryLog;
          use App\Nexora\Enterprise\Services\TenantContext;
          use App\Nexora\Foundation\Contracts\SettingsContract;
          use Illuminate\Contracts\Console\Kernel;
          $root=(string)$argv[1]; $action=(string)$argv[2]; $value=$argv[3]??null;
          require $root.'/vendor/autoload.php'; $app=require $root.'/bootstrap/app.php'; $app->make(Kernel::class)->bootstrap();
          $primary=EnterpriseOrganization::query()->where('is_default',true)->firstOrFail(); app(TenantContext::class)->set($primary);
          if ($action==='public') { app(SettingsContract::class)->set('search.public_enabled',$value==='1'); echo 'ok'; exit; }
          if ($action==='log-count') { echo SearchQueryLog::query()->where('normalized_query',(string)$value)->count(); exit; }
          if ($action==='log-tenant') { echo (string)(SearchQueryLog::query()->where('normalized_query',(string)$value)->value('tenant_id') ?? ''); exit; }
          if ($action==='audit-count') { echo AuditLog::query()->where('event','search.index.rebuilt')->count(); exit; }
          fwrite(STDERR,'unknown helper action'.PHP_EOL); exit(2);
          '@ | Set-Content -Encoding Ascii $helper

          $serverOut = Join-Path $env:EVIDENCE_DIR 'search-server.out.log'
          $serverErr = Join-Path $env:EVIDENCE_DIR 'search-server.err.log'
          $docroot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'public'))
          $router = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php'))
          $server = Start-Process -FilePath 'php' -ArgumentList @('-S','127.0.0.1:8000','-t',$docroot,$router) -WorkingDirectory $docroot -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
          try {
            $ready=$false
            for ($i=0;$i -lt 60;$i++) {
              if ($server.HasExited) { throw "Search server exited early with code $($server.ExitCode)." }
              $probe=(& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/login").Trim()
              if (($LASTEXITCODE -eq 0)-and($probe -eq '200')) { $ready=$true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Search target server did not become ready.' }

            $publicBody=Join-Path $env:RUNNER_TEMP 'n112-public-search.html'
            $publicStatus=(& curl.exe -sS -o $publicBody -w '%{http_code}' "$env:BASE_URL/search?q=n112alpha").Trim()
            $publicHtml=Get-Content -Raw $publicBody
            $publicHasExpected=$publicHtml.Contains('N112Alpha Updated Primary')
            $publicLeaksProtected=$publicHtml.Contains('N112Alpha Primary Protected')
            $publicLeaksOther=$publicHtml.Contains('N112Alpha Other Tenant')
            $publicLeaksMedia=$publicHtml.Contains('N112Alpha Primary Media')
            $publicNoindex=$publicHtml.Contains('noindex,follow')
            if ($publicStatus -ne '200' -or -not $publicHasExpected -or $publicLeaksProtected -or $publicLeaksOther -or $publicLeaksMedia -or -not $publicNoindex) { throw 'Real public Search HTTP visibility contract failed.' }

            $validationStatus=(& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/search?q=x").Trim()
            if ($validationStatus -eq '200') { throw 'One-character public Search query unexpectedly bypassed validation.' }

            & php $helper $env:GITHUB_WORKSPACE public 0 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to disable public Search through SettingsContract.' }
            $disabledStatus=(& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/search?q=n112alpha").Trim()
            if ($disabledStatus -ne '404') { throw "Disabled public Search expected 404, got $disabledStatus." }
            & php $helper $env:GITHUB_WORKSPACE public 1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to re-enable public Search.' }

            $normalQuery='n112privacy-normal'; $dntQuery='n112privacy-dnt'; $gpcQuery='n112privacy-gpc'
            & curl.exe -sS -o NUL "$env:BASE_URL/search?q=$normalQuery"
            & curl.exe -sS -H 'DNT: 1' -o NUL "$env:BASE_URL/search?q=$dntQuery"
            & curl.exe -sS -H 'Sec-GPC: 1' -o NUL "$env:BASE_URL/search?q=$gpcQuery"
            $normalCount=[int]((& php $helper $env:GITHUB_WORKSPACE log-count $normalQuery).Trim())
            $dntCount=[int]((& php $helper $env:GITHUB_WORKSPACE log-count $dntQuery).Trim())
            $gpcCount=[int]((& php $helper $env:GITHUB_WORKSPACE log-count $gpcQuery).Trim())
            $logTenant=(& php $helper $env:GITHUB_WORKSPACE log-tenant $normalQuery).Trim()
            $state=Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'search-state.json') | ConvertFrom-Json
            if ($normalCount -ne 1 -or $dntCount -ne 0 -or $gpcCount -ne 0 -or $logTenant -ne $state.primary_tenant_id) { throw 'Search query analytics privacy/tenant boundary failed.' }

            $guestHeaders=Join-Path $env:RUNNER_TEMP 'n112-admin-guest.headers.txt'
            $guestStatus=(& curl.exe -sS -D $guestHeaders -o NUL -w '%{http_code}' "$env:BASE_URL/admin/search?q=n112alpha").Trim()
            $guestLocation=([regex]::Match((Get-Content -Raw $guestHeaders),'(?im)^Location:\s*(\S+)\s*$')).Groups[1].Value
            if ($guestStatus -ne '302' -or $guestLocation -notmatch '/login$') { throw "Guest Admin Search boundary failed: $guestStatus -> $guestLocation" }

            function Login-N112([string]$email,[string]$password,[string]$prefix) {
              $cookies=Join-Path $env:RUNNER_TEMP "$prefix-cookies.txt"
              $page=Join-Path $env:RUNNER_TEMP "$prefix-login.html"
              & curl.exe -sS -c $cookies "$env:BASE_URL/login" -o $page
              if ($LASTEXITCODE -ne 0) { throw "Unable to fetch login page for $email" }
              $csrf=([regex]::Match((Get-Content -Raw $page),'<meta\s+name="csrf-token"\s+content="([^"]+)"')).Groups[1].Value
              if (-not $csrf) { throw "Unable to extract login CSRF for $email" }
              $headers=Join-Path $env:RUNNER_TEMP "$prefix-login.headers.txt"
              $status=(& curl.exe -sS -b $cookies -c $cookies -D $headers -o NUL -w '%{http_code}' -X POST "$env:BASE_URL/login" --data-urlencode "_token=$csrf" --data-urlencode "email=$email" --data-urlencode "password=$password").Trim()
              $location=([regex]::Match((Get-Content -Raw $headers),'(?im)^Location:\s*(\S+)\s*$')).Groups[1].Value
              if ($status -ne '302' -or $location -notmatch '/admin/?$') { throw "Admin-capable login failed for $email: $status -> $location" }
              return $cookies
            }

            $noSearchCookies=Login-N112 'n112-no-search@example.test' 'N112-NoSearch-Password!1' 'n112-no-search'
            $noSearchStatus=(& curl.exe -sS -b $noSearchCookies -o NUL -w '%{http_code}' "$env:BASE_URL/admin/search?q=n112alpha").Trim()
            if ($noSearchStatus -ne '403') { throw "search.use denial expected 403, got $noSearchStatus." }

            $noReindexCookies=Login-N112 'n112-no-reindex@example.test' 'N112-NoReindex-Password!1' 'n112-no-reindex'
            $noReindexBody=Join-Path $env:RUNNER_TEMP 'n112-no-reindex-search.html'
            $noReindexSearch=(& curl.exe -sS -b $noReindexCookies -o $noReindexBody -w '%{http_code}' "$env:BASE_URL/admin/search?q=n112alpha").Trim()
            if ($noReindexSearch -ne '200') { throw "Authorized search.use user expected 200, got $noReindexSearch." }
            $adminPage=Join-Path $env:RUNNER_TEMP 'n112-no-reindex-admin.html'
            & curl.exe -sS -b $noReindexCookies "$env:BASE_URL/admin" -o $adminPage
            $noReindexCsrf=([regex]::Match((Get-Content -Raw $adminPage),'<meta\s+name="csrf-token"\s+content="([^"]+)"')).Groups[1].Value
            $noReindexStatus=(& curl.exe -sS -b $noReindexCookies -o NUL -w '%{http_code}' -X POST "$env:BASE_URL/admin/discovery/reindex" --data-urlencode "_token=$noReindexCsrf").Trim()
            if ($noReindexStatus -ne '403') { throw "search.index.manage denial expected 403, got $noReindexStatus." }

            $adminCookies=Login-N112 'n112-admin@example.test' 'N112-Admin-Password!1' 'n112-admin'
            $adminBody=Join-Path $env:RUNNER_TEMP 'n112-admin-search.html'
            $adminStatus=(& curl.exe -sS -b $adminCookies -o $adminBody -w '%{http_code}' "$env:BASE_URL/admin/search?q=n112alpha").Trim()
            $adminHtml=Get-Content -Raw $adminBody
            $adminHasDocument=$adminHtml.Contains('N112Alpha Updated Primary')
            $adminHasMedia=$adminHtml.Contains('N112Alpha Primary Media')
            $adminLeaksOtherDoc=$adminHtml.Contains('N112Alpha Other Tenant')
            $adminLeaksOtherMember=$adminHtml.Contains('N112Alpha Other Member')
            if ($adminStatus -ne '200' -or -not $adminHasDocument -or -not $adminHasMedia -or $adminLeaksOtherDoc -or $adminLeaksOtherMember) { throw 'Authorized Admin Search content/tenant boundary failed.' }

            $adminHome=Join-Path $env:RUNNER_TEMP 'n112-admin-home.html'
            & curl.exe -sS -b $adminCookies "$env:BASE_URL/admin" -o $adminHome
            $adminCsrf=([regex]::Match((Get-Content -Raw $adminHome),'<meta\s+name="csrf-token"\s+content="([^"]+)"')).Groups[1].Value
            if (-not $adminCsrf) { throw 'Unable to extract authenticated admin CSRF.' }
            $reindexStatus=(& curl.exe -sS -b $adminCookies -o NUL -w '%{http_code}' -X POST "$env:BASE_URL/admin/discovery/reindex" --data-urlencode "_token=$adminCsrf").Trim()
            if ($reindexStatus -ne '302') { throw "Authorized manual reindex expected redirect, got $reindexStatus." }
            $auditCount=[int]((& php $helper $env:GITHUB_WORKSPACE audit-count '').Trim())
            if ($auditCount -lt 1) { throw 'Authorized manual reindex did not record search.index.rebuilt audit evidence.' }

            @{
              public_search_http=[int]$publicStatus; public_expected_document_visible=$publicHasExpected; public_protected_disclosed=$publicLeaksProtected;
              public_other_tenant_disclosed=$publicLeaksOther; public_media_disclosed=$publicLeaksMedia; public_noindex_follow=$publicNoindex;
              one_character_query_http=[int]$validationStatus; disabled_search_http=[int]$disabledStatus;
              analytics_normal_count=$normalCount; analytics_dnt_count=$dntCount; analytics_gpc_count=$gpcCount; analytics_tenant_id=$logTenant;
              guest_admin_search_http=[int]$guestStatus; guest_admin_location='/login'; no_search_permission_http=[int]$noSearchStatus;
              search_without_reindex_http=[int]$noReindexSearch; no_reindex_permission_http=[int]$noReindexStatus;
              authorized_admin_search_http=[int]$adminStatus; admin_document_visible=$adminHasDocument; admin_media_visible=$adminHasMedia;
              admin_other_document_disclosed=$adminLeaksOtherDoc; admin_other_member_disclosed=$adminLeaksOtherMember;
              authorized_reindex_http=[int]$reindexStatus; search_reindex_audit_count=$auditCount
            } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'http-boundary.json')
          }
          finally {
            & cmd.exe /d /c "taskkill /PID $($server.Id) /T /F >NUL 2>&1 || exit /b 0" | Out-Null
          }

          $fatalPatterns='Fatal error|Uncaught|production\.ERROR|local\.ERROR'
          $serverErrors=Get-Content -Raw $serverErr -ErrorAction SilentlyContinue
          if ($serverErrors -match $fatalPatterns) { throw 'Search HTTP server log contains a fatal/unhandled runtime error.' }
          @{ fatal_runtime_error = $false; reviewed_files = @('install-server.err.log','search-server.err.log') } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'log-review.json')

      - name: Write N1.12 evidence summary
        if: success()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $binding=Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'source-binding.json') | ConvertFrom-Json
          $install=Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'install-result.json') | ConvertFrom-Json
          $runtime=Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'runtime-result.json') | ConvertFrom-Json
          $contract=Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'contract-result.json') | ConvertFrom-Json
          $state=Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'search-state.json') | ConvertFrom-Json
          $http=Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'http-boundary.json') | ConvertFrom-Json
          $logs=Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'log-review.json') | ConvertFrom-Json
          @{
            schema=1; acceptance='N1.12 / SEARCH-200 bounded Search 2.0'; status='pass'; issue=41;
            source_sha=$binding.source_sha; carrier_sha=$binding.carrier_sha; toolchain=$binding;
            install=$install; reconcile=$runtime; frozen_contracts=$contract; search_state=$state; http=$http; logs=$logs;
            explicit_exclusions=@(
              'external search providers including Elasticsearch/OpenSearch/Meilisearch/Algolia',
              'distributed indexing, replication, HA and provider failover',
              'unimplemented facets/faceted navigation',
              'Search performance, scale, relevance-SLO or full-text-engine certification',
              'canonical SEARCH-200 dependency completion beyond behavior exercised here',
              'whole analytics/crawler platform certification',
              'five-engine database matrix',
              'N1.13+, HA, backup/restore/upgrade, C5, C6 and final release'
            )
          } | ConvertTo-Json -Depth 12 | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'summary.json')

      - name: Upload N1.12 bounded target evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexora-n112-search-target-${{ github.event.pull_request.base.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14
