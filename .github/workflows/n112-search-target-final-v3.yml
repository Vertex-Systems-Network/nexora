        run: |
          $ErrorActionPreference='Stop'
          $toggle=Join-Path $env:RUNNER_TEMP 'n112-v3-toggle.php'
          @'
          <?php
          declare(strict_types=1);
          use App\Models\EnterpriseOrganization; use App\Nexora\Enterprise\Services\TenantContext; use App\Nexora\Foundation\Contracts\SettingsContract; use Illuminate\Contracts\Console\Kernel;
          $root=(string)$argv[1]; require $root.'/vendor/autoload.php'; $app=require $root.'/bootstrap/app.php'; $app->make(Kernel::class)->bootstrap(); $primary=EnterpriseOrganization::query()->where('is_default',true)->firstOrFail(); app(TenantContext::class)->set($primary); app(SettingsContract::class)->set((string)$argv[2],filter_var((string)$argv[3],FILTER_VALIDATE_BOOL));
          '@ | Set-Content -Encoding Ascii $toggle
          $serverOut=Join-Path $env:EVIDENCE_DIR 'search-server.out.log'; $serverErr=Join-Path $env:EVIDENCE_DIR 'search-server.err.log'
          $docroot=[System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'public')); $router=[System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php'))
          $server=Start-Process -FilePath 'php' -ArgumentList @('-S','127.0.0.1:8000','-t',$docroot,$router) -WorkingDirectory $docroot -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
          function Get-Csrf([string]$Html){$m=[regex]::Match($Html,'<meta\s+name="csrf-token"\s+content="([^"]+)"');if(-not$m.Success){throw 'CSRF missing.'};return $m.Groups[1].Value}
          function Login([string]$Email,[string]$Password,[string]$Cookies){& php artisan cache:clear|Out-Null;if($LASTEXITCODE-ne 0){throw 'Cache clear failed.'};$p=Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N')+'.html');& curl.exe -sS -c $Cookies "$env:BASE_URL/login" -o $p;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE};$csrf=Get-Csrf(Get-Content -Raw $p);$s=(& curl.exe -sS -b $Cookies -c $Cookies -o NUL -w '%{http_code}' -X POST "$env:BASE_URL/login" --data-urlencode "_token=$csrf" --data-urlencode "email=$Email" --data-urlencode "password=$Password").Trim();if($s-ne'302'){throw "Login $Email HTTP $s"}}
          function Generation([string]$Cookies){$h=Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N')+'.headers');$b=Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N')+'.html');$s=(& curl.exe -sS -b $Cookies -c $Cookies -D $h -o $b -w '%{http_code}' "$env:BASE_URL/admin").Trim();if($s-ne'200'){throw "Admin shell HTTP $s"};$m=[regex]::Match((Get-Content -Raw $h),'(?im)^X-Nexora-Deployment-Generation:\s*([^\r\n]+)');if(-not$m.Success){throw 'Generation header missing.'};return $m.Groups[1].Value.Trim().ToLowerInvariant()}
          function Results([string]$Path,[string]$Status,[string]$Label){if($Status-ne'200'){$body=Get-Content -Raw $Path -ErrorAction SilentlyContinue;throw "$Label HTTP $Status body=$body"};try{$p=Get-Content -Raw $Path|ConvertFrom-Json}catch{throw "$Label invalid JSON"};return @($p.results)}
          try{
            $ready=$false;for($i=0;$i-lt60;$i++){if($server.HasExited){throw 'Search server exited.'};$s=(& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/search").Trim();if(($LASTEXITCODE-eq0)-and($s-eq'200')){$ready=$true;break};Start-Sleep -Seconds 1};if(-not$ready){throw 'Search server not ready.'}
            $publicBody=Join-Path $env:EVIDENCE_DIR 'public-search.html';$publicStatus=(& curl.exe -sS -o $publicBody -w '%{http_code}' "$env:BASE_URL/search?q=n112v3alpha").Trim();$html=Get-Content -Raw $publicBody;$publicVisible=$html.Contains('N112V3Alpha Primary Public');$protectedLeak=$html.Contains('N112V3Alpha Primary Protected');$mediaLeak=$html.Contains('N112V3Alpha Updated Primary Media');$robots=$html.Contains('noindex,follow');if($publicStatus-ne'200'-or-not$publicVisible-or$protectedLeak-or$mediaLeak-or-not$robots){throw 'Public Search boundary failed.'}
            $short=(& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/search?q=x").Trim();if($short-ne'302'){throw "Short query HTTP $short"}
            & php $toggle $env:GITHUB_WORKSPACE 'search.public_enabled' 'false';if($LASTEXITCODE-ne0){throw 'Disable Search failed.'};$disabled=(& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/search?q=n112v3alpha").Trim();if($disabled-ne'404'){throw "Disabled Search HTTP $disabled"};& php $toggle $env:GITHUB_WORKSPACE 'search.public_enabled' 'true';if($LASTEXITCODE-ne0){throw 'Enable Search failed.'}
            $gpc=(& curl.exe -sS -H 'Sec-GPC: 1' -o NUL -w '%{http_code}' "$env:BASE_URL/search?q=n112v3gpc").Trim();$dnt=(& curl.exe -sS -H 'DNT: 1' -o NUL -w '%{http_code}' "$env:BASE_URL/search?q=n112v3dnt").Trim();if($gpc-ne'200'-or$dnt-ne'200'){throw 'Privacy opt-out requests failed.'}
            $guest=(& curl.exe -sS -o NUL -w '%{http_code}' "$env:BASE_URL/admin/search?q=n112v3alpha").Trim();if($guest-ne'302'){throw "Guest Admin Search HTTP $guest"}

            $adminC=Join-Path $env:RUNNER_TEMP 'n112-v3-admin.cookies';Login 'n112-v3-admin@example.test' 'N112-V3-Admin!1' $adminC;$generation=Generation $adminC
            $adminJ=Join-Path $env:EVIDENCE_DIR 'admin-search.json';$adminS=(& curl.exe -sS -b $adminC -o $adminJ -w '%{http_code}' -H 'Accept: application/json' -H "X-Nexora-Deployment-Generation: $generation" "$env:BASE_URL/admin/search?q=n112v3alpha").Trim();$adminR=Results $adminJ $adminS 'Admin Search';$adminTypes=@($adminR|%{[string]$_.type});$adminTitles=@($adminR|%{[string]$_.title});if($adminTypes-notcontains'document'-or$adminTypes-notcontains'media'){throw "Admin types=$($adminTypes-join',')"};if(($adminTitles-contains'N112V3Alpha Other Tenant')-or($adminTitles-contains'N112V3Alpha Other Media')-or($adminTitles-contains'N112V3 Other Member')){throw 'Other tenant disclosed.'}
            $noC=Join-Path $env:RUNNER_TEMP 'n112-v3-no.cookies';Login 'n112-v3-no-search@example.test' 'N112-V3-NoSearch!1' $noC;$noBody=Join-Path $env:EVIDENCE_DIR 'no-search-permission.txt';$noS=(& curl.exe -sS -b $noC -o $noBody -w '%{http_code}' -H 'Accept: application/json' -H "X-Nexora-Deployment-Generation: $generation" "$env:BASE_URL/admin/search?q=n112v3alpha").Trim();if($noS-ne'403'){throw "search.use expected 403 got $noS"}
            $docC=Join-Path $env:RUNNER_TEMP 'n112-v3-doc.cookies';Login 'n112-v3-doc-only@example.test' 'N112-V3-DocOnly!1' $docC;$docJ=Join-Path $env:EVIDENCE_DIR 'document-only-search.json';$docS=(& curl.exe -sS -b $docC -o $docJ -w '%{http_code}' -H 'Accept: application/json' -H "X-Nexora-Deployment-Generation: $generation" "$env:BASE_URL/admin/search?q=n112v3alpha").Trim();$docR=Results $docJ $docS 'Document-only';$docTypes=@($docR|%{[string]$_.type});if($docTypes-notcontains'document'-or$docTypes-contains'media'){throw "Doc-only types=$($docTypes-join',')"}
            $mediaC=Join-Path $env:RUNNER_TEMP 'n112-v3-media.cookies';Login 'n112-v3-media-only@example.test' 'N112-V3-MediaOnly!1' $mediaC;$mediaJ=Join-Path $env:EVIDENCE_DIR 'media-only-search.json';$mediaS=(& curl.exe -sS -b $mediaC -o $mediaJ -w '%{http_code}' -H 'Accept: application/json' -H "X-Nexora-Deployment-Generation: $generation" "$env:BASE_URL/admin/search?q=n112v3alpha").Trim();$mediaR=Results $mediaJ $mediaS 'Media-only';$mediaTypes=@($mediaR|%{[string]$_.type});if($mediaTypes-contains'document'-or$mediaTypes-notcontains'media'){throw "Media-only types=$($mediaTypes-join',')"}
            $nrC=Join-Path $env:RUNNER_TEMP 'n112-v3-nr.cookies';Login 'n112-v3-no-reindex@example.test' 'N112-V3-NoReindex!1' $nrC;$nrPage=Join-Path $env:RUNNER_TEMP 'n112-v3-nr.html';& curl.exe -sS -b $nrC -c $nrC "$env:BASE_URL/admin" -o $nrPage;if($LASTEXITCODE-ne0){exit $LASTEXITCODE};$nrCsrf=Get-Csrf(Get-Content -Raw $nrPage);$nrS=(& curl.exe -sS -b $nrC -o NUL -w '%{http_code}' -X POST "$env:BASE_URL/admin/discovery/reindex" --data-urlencode "_token=$nrCsrf").Trim();if($nrS-ne'403'){throw "search.index.manage expected 403 got $nrS"}
            $adminPage=Join-Path $env:RUNNER_TEMP 'n112-v3-admin.html';& curl.exe -sS -b $adminC -c $adminC "$env:BASE_URL/admin" -o $adminPage;if($LASTEXITCODE-ne0){exit $LASTEXITCODE};$adminCsrf=Get-Csrf(Get-Content -Raw $adminPage);$reindex=(& curl.exe -sS -b $adminC -o NUL -w '%{http_code}' -X POST "$env:BASE_URL/admin/discovery/reindex" --data-urlencode "_token=$adminCsrf").Trim();if($reindex-ne'302'){throw "Authorized reindex HTTP $reindex"}
            @{deployment_generation=$generation;deployment_generation_header_sent=$true;public_search_http=[int]$publicStatus;public_document_visible=$publicVisible;protected_document_disclosed=$protectedLeak;public_media_disclosed=$mediaLeak;robots_noindex_follow=$robots;short_query_http=[int]$short;disabled_search_http=[int]$disabled;gpc_search_http=[int]$gpc;dnt_search_http=[int]$dnt;guest_admin_search_http=[int]$guest;authorized_admin_search_http=[int]$adminS;authorized_admin_types=$adminTypes;no_search_permission_http=[int]$noS;document_only_search_http=[int]$docS;document_only_types=$docTypes;media_only_search_http=[int]$mediaS;media_only_types=$mediaTypes;no_reindex_permission_http=[int]$nrS;authorized_reindex_http=[int]$reindex;other_tenant_admin_search_disclosed=$false}|ConvertTo-Json -Depth 6|Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'http-boundary.json')
          }finally{& cmd.exe /d /c "taskkill /PID $($server.Id) /T /F >NUL 2>&1 || exit /b 0"|Out-Null}

          $verify=Join-Path $env:RUNNER_TEMP 'n112-v3-post-http.php'
          @'
          <?php
          declare(strict_types=1);
          use App\Models\AuditLog; use App\Models\EnterpriseOrganization; use App\Models\SearchQueryLog; use App\Nexora\Enterprise\Services\TenantContext; use Illuminate\Contracts\Console\Kernel;
          $root=(string)$argv[1]; require $root.'/vendor/autoload.php'; $app=require $root.'/bootstrap/app.php'; $app->make(Kernel::class)->bootstrap(); $primary=EnterpriseOrganization::query()->where('is_default',true)->firstOrFail(); app(TenantContext::class)->set($primary); $normal=SearchQueryLog::query()->where('normalized_query','n112v3alpha')->count(); $gpc=SearchQueryLog::query()->where('normalized_query','n112v3gpc')->count(); $dnt=SearchQueryLog::query()->where('normalized_query','n112v3dnt')->count(); $audit=AuditLog::query()->where('event','search.index.rebuilt')->exists(); $state=['normal_query_logs'=>$normal,'gpc_query_logs'=>$gpc,'dnt_query_logs'=>$dnt,'reindex_audit_recorded'=>$audit]; if($normal<1||$gpc!==0||$dnt!==0||!$audit){fwrite(STDERR,json_encode($state,JSON_PRETTY_PRINT).PHP_EOL);exit(2);} echo json_encode($state,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES).PHP_EOL;
          '@ | Set-Content -Encoding Ascii $verify
          & php $verify $env:GITHUB_WORKSPACE | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'privacy-audit-state.json')
          if($LASTEXITCODE-ne0){throw 'Privacy/audit verification failed.'}
          $err=Get-Content -Raw (Join-Path $env:EVIDENCE_DIR 'search-server.err.log') -ErrorAction SilentlyContinue
