          @{schema=5;status='pass';stage='SEARCH-200';legacy_alias='N1.12';source_sha=$binding.source_sha;carrier_sha=$binding.carrier_sha;fresh_install=$install.installed_lock;post_install_reconcile=$runtime.reconciled;frozen_contracts='pass';lifecycle_target='pass';tenant_isolation='pass';dual_rbac_fixture=$state.dual_rbac_fixture;browser_generation_protocol='pass';deployment_generation=$http.deployment_generation;public_http=$http.public_search_http;admin_http=$http.authorized_admin_search_http;search_use_boundary=$http.no_search_permission_http;document_permission_boundary=$http.document_only_search_http;media_permission_boundary=$http.media_only_search_http;reindex_permission_boundary=$http.no_reindex_permission_http;authorized_reindex=$http.authorized_reindex_http;gpc_query_logs=$privacy.gpc_query_logs;dnt_query_logs=$privacy.dnt_query_logs;reindex_audit_recorded=$privacy.reindex_audit_recorded;external_search_provider_certified=$false;distributed_index_certified=$false;facets_certified=$false;performance_scale_certified=$false;five_engine_matrix_certified=$false}|ConvertTo-Json -Depth 6|Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE_DIR 'summary.json')

