name: Temporary critical source reseal

on:
  push:
    branches:
      - fix/portable-runtime-ux
    paths:
      - .github/workflows/temporary-critical-source-reseal.yml

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout portability branch
        uses: actions/checkout@v7
        with:
          ref: fix/portable-runtime-ux
          fetch-depth: 1

      - name: Reseal current critical source set
        run: |
          set -euo pipefail
          php scripts/refresh-critical-source-manifest.php --write
          php scripts/refresh-critical-source-manifest.php --check

      - name: Verify generated scope and commit
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'Critical source manifest already current; no generated commit required.'
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              bootstrap/nexora-source-manifest.json|config/installer.php) ;;
              *) echo "Unexpected reseal mutation: $path" >&2; exit 2 ;;
            esac
          done
          git diff --check -- bootstrap/nexora-source-manifest.json config/installer.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/nexora-source-manifest.json config/installer.php
          git commit -m 'chore: reseal portability critical source identity'
          git push origin HEAD:fix/portable-runtime-ux
