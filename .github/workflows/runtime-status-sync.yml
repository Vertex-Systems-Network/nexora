name: Nexora runtime closure status sync

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-status-sync.yml'
      - '.github/scripts/runtime-status-sync.py'

permissions:
  contents: write

jobs:
  sync-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic carrier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Sync exact runtime branch status only
        shell: bash
        env:
          EXPECTED_TARGET_HEAD: 68d6aa5d8610e05acf7c51bed503ae09bd4311cd
          TARGET_BRANCH: feat/runtime-recovery-orchestrator
        run: |
          set -euo pipefail
          cp .github/scripts/runtime-status-sync.py /tmp/runtime-status-sync.py
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET_HEAD"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          python /tmp/runtime-status-sync.py
          python -m json.tool .ai/state.json >/dev/null
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(.ai/handoff/current.md .ai/plans/active.md .ai/state.json README.md)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .ai/state.json .ai/handoff/current.md .ai/plans/active.md
          git commit -m 'docs(ai): reconcile integrated runtime closure status'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
