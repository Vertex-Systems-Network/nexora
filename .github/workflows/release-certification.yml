name: Nexora release certification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-release-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact source checkout verified: $ACTUAL_SHA"

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Certification preflight
        run: php scripts/certification-preflight.php --source-only

      - name: Source Guard
        run: php scripts/source-guard.php --source-only

      - name: Runtime recovery control contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/runtime-recovery-orchestrator.php
          php -l scripts/runtime-recovery-orchestrator-contract-verify.php
          php -l scripts/runtime-recovery-readiness-exit-contract-verify.php
          php -l scripts/runtime-recovery-target-file-containment-contract-verify.php
          php scripts/runtime-recovery-orchestrator-contract-verify.php
          php scripts/runtime-recovery-readiness-exit-contract-verify.php
          php scripts/runtime-recovery-target-file-containment-contract-verify.php

      - name: Unified source certification
        run: php scripts/certify-release.php --source-only

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend dependency compatibility
        run: |
          npm run typecheck
          npm run test
          npm run build:raw