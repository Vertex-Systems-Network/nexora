name: Nexora release certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  governance:
    name: governance
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'security/installer-boundary-hardening-2026-09-15' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Materialize and verify certified npm lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10391526344'
          EXPECTED_LOCK_SHA256: '95c2d693fbbd3bfe3d01540cc01d699dca2606fa1366a51ee3d51edad92f971a'
        run: |
          set -euo pipefail
          curl --fail-with-body --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/nexora-lock.zip
          unzip -p /tmp/nexora-lock.zip package-lock.json > package-lock.json
          echo "${EXPECTED_LOCK_SHA256}  package-lock.json" | sha256sum --check --strict
          test "$(php -r '$d=json_decode(file_get_contents("package-lock.json"),true,512,JSON_THROW_ON_ERROR); echo (int)($d["lockfileVersion"]??0);')" = '3'

      - name: Commit certified npm lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Certified npm lock already present.'
            exit 0
          fi
          git commit -m 'build: add certified npm lockfile'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
