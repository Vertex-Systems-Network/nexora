name: Nexora release certification

# Certification is pinned to the dedicated LOCAL-WIN-03 self-hosted Windows runner.
# LOCAL-WIN-03 must carry a custom runner label named exactly `LOCAL-WIN-03`; otherwise jobs remain queued
# rather than falling back to another self-hosted machine. Runtime also verifies RUNNER_NAME fail-closed.
# The runner owns its PHP/Node toolchain; certification verifies the installed versions instead of mutating
# the machine with hosted-runner setup actions.
# The active development branch is temporarily push-triggered while the self-hosted workflow is stabilized;
# remove that extra branch trigger after a stable green run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev/n1-0b-core-functional-qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-release-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-certification:
    name: Source certification
    runs-on: [self-hosted, LOCAL-WIN-03]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5

      - name: Verify dedicated runner identity
        run: |
          echo Runner name: %RUNNER_NAME%
          if /I not "%RUNNER_NAME%"=="LOCAL-WIN-03" (
            echo Nexora certification is restricted to LOCAL-WIN-03. Current runner is %RUNNER_NAME%.
            exit /b 1
          )

      - name: Verify local Windows toolchain
        run: |
          php -r "if (version_compare(PHP_VERSION, '8.3.0', '<')) { fwrite(STDERR, 'Nexora requires PHP >= 8.3.0; self-hosted runner has '.PHP_VERSION.PHP_EOL); exit(1); } echo 'PHP '.PHP_VERSION.PHP_EOL;"
          node -e "const v=process.versions.node; if (Number(v.split('.')[0]) < 22) { console.error('Nexora source certification requires Node >= 22.0.0; self-hosted runner has '+v); process.exit(1); } console.log('Node '+v);"
          php --version
          node --version
          npm --version

      - name: Certification preflight
        run: php scripts/certification-preflight.php --source-only

      - name: Source Guard
        run: php scripts/source-guard.php --source-only

      - name: Post-install runtime convergence contract
        run: php scripts/post-install-runtime-convergence-contract-verify.php

      - name: DEV-4 core functional source contract
        run: php scripts/dev4-core-functional-contract-verify.php

      - name: Theme product source contract
        run: php scripts/theme-product-contract-verify.php

      - name: Extension product source contract
        run: php scripts/extension-product-contract-verify.php

      - name: Studio product source contract
        run: php scripts/studio-product-contract-verify.php

      - name: Document product source contract
        run: php scripts/document-product-contract-verify.php

      - name: Content collection product source contract
        run: php scripts/collection-product-contract-verify.php

      - name: Publishing + SEO product source contract
        run: php scripts/publishing-seo-product-contract-verify.php

      - name: Admin UX product source contract
        run: php scripts/admin-ux-product-contract-verify.php

      - name: Forms + Data + Workflows product source contract
        run: php scripts/forms-workflow-product-contract-verify.php

      - name: Data Connections product source contract
        run: php scripts/data-connection-product-contract-verify.php

      - name: Primary SQL portability source contract
        run: php scripts/primary-sql-portability-contract-verify.php

      - name: Installer database UX source contract
        run: php scripts/installer-database-ux-contract-verify.php

      - name: Development target QA source contract
        run: php scripts/development-target-qa-contract-verify.php

      - name: Marketplace product source contract
        run: php scripts/marketplace-product-contract-verify.php

      - name: Commerce product source contract
        run: php scripts/commerce-product-contract-verify.php

      - name: Customer Portal product source contract
        run: php scripts/customer-portal-product-contract-verify.php

      - name: CRM + Membership product source contract
        run: php scripts/crm-membership-product-contract-verify.php

      - name: Search 2.0 product source contract
        run: php scripts/search-product-contract-verify.php

      - name: Collaboration product source contract
        run: php scripts/collaboration-product-contract-verify.php

      - name: Automation product source contract
        run: php scripts/automation-product-contract-verify.php

      - name: AI Platform product source contract
        run: php scripts/ai-platform-product-contract-verify.php

      - name: Multisite / Organizations product source contract
        run: php scripts/multisite-organizations-product-contract-verify.php

      - name: SSO / Enterprise Governance product source contract
        run: php scripts/enterprise-governance-product-contract-verify.php

      - name: Public API / SDK product source contract
        run: php scripts/public-api-sdk-product-contract-verify.php

      - name: Content Migration product source contract
        run: php scripts/content-migration-product-contract-verify.php

      - name: Observability product source contract
        run: php scripts/observability-product-contract-verify.php

      - name: Forge / Developer Experience product source contract
        run: php scripts/forge-developer-experience-product-contract-verify.php

      - name: Sentinel 2.0 product source contract
        run: php scripts/sentinel2-product-contract-verify.php

      - name: Marketplace 2.0 product source contract
        run: php scripts/marketplace2-product-contract-verify.php

      - name: Cloud / HA product source contract
        run: php scripts/cloud-ha-product-contract-verify.php

      - name: Backup / DR / Upgrade product source contract
        run: php scripts/backup-dr-upgrade-product-contract-verify.php

      - name: Performance + Accessibility + Release product source contract
        run: php scripts/performance-accessibility-release-product-contract-verify.php

      - name: Unified source certification
        run: php scripts/certify-release.php --source-only
