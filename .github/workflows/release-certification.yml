name: Nexora release certification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-release-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact source checkout verified: $ACTUAL_SHA"

      - name: PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Node 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Verify frontend toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "10.9.2"

      - name: Certification preflight
        run: php scripts/certification-preflight.php --source-only

      - name: Source Guard
        run: php scripts/source-guard.php --source-only

      - name: Runtime recovery and build verification contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/runtime-recovery-orchestrator.php
          php -l scripts/rc93-post-install-identity-repair.php
          php -l scripts/runtime-recovery-orchestrator-contract-verify.php
          php -l scripts/runtime-recovery-readiness-exit-contract-verify.php
          php -l scripts/runtime-recovery-target-file-containment-contract-verify.php
          php -l scripts/rc93-repair-path-containment-contract-verify.php
          php -l scripts/runtime-recovery-mutation-evidence-contract-verify.php
          php -l scripts/runtime-recovery-child-boundary-contract-verify.php
          php -l scripts/lib/performance-build-leaks.php
          php -l scripts/performance-build-leak-contract-verify.php
          php -l scripts/performance-build-verify.php
          php scripts/runtime-recovery-orchestrator-contract-verify.php
          php scripts/runtime-recovery-readiness-exit-contract-verify.php
          php scripts/runtime-recovery-target-file-containment-contract-verify.php
          php scripts/rc93-repair-path-containment-contract-verify.php
          php scripts/runtime-recovery-mutation-evidence-contract-verify.php
          php scripts/runtime-recovery-child-boundary-contract-verify.php
          php scripts/performance-build-leak-contract-verify.php

      - name: Unified source certification
        run: php scripts/certify-release.php --source-only

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend dependency compatibility
        run: |
          npm run typecheck
          npm run test
          npm run build:raw
