name: Nexora AI-reviewed lock promotion proof

on:
  pull_request:
    paths:
      - '.github/workflows/ai-reviewed-lock-promotion-proof.yml'
      - '.ai/plans/issue-52-ai-lock-review-exception.md'
      - 'package.json'
      - 'composer.json'
      - 'vite.config.ts'
      - 'scripts/dependency-lock-promote.php'
      - 'scripts/dependency-lock-review.php'
      - 'scripts/dependency-lock-refresh.php'
      - 'scripts/lib/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ai-reviewed-lock-promotion-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact diagnostic checkout verified: $ACTUAL_SHA"

      - name: PHP 8.4.25 and Composer 2.10.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.25'
          coverage: none
          tools: composer:2.10.3

      - name: Node 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Use exact reviewed npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2 --no-audit --no-fund
          test "$(npm --version)" = "10.9.2"
          test "$(node --version)" = "v22.23.2"
          test "$(composer --version --no-ansi | awk '{print $3}')" = "2.10.3"
          php -r 'if (PHP_VERSION !== "8.4.25") { fwrite(STDERR, "unexpected PHP ".PHP_VERSION.PHP_EOL); exit(1); }'

      - name: Download exact governed candidate artifact
        uses: actions/download-artifact@v7
        with:
          name: nexora-governed-lock-proof-73b45bfde0e339c223f9c1b250e79ed391ecc936
          path: .governed-proof
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34372657034

      - name: Stage and verify exact reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ROOT='.governed-proof/storage/app/nexora/dependency-intake'
          test -s "$CANDIDATE_ROOT/candidates/candidate.json"
          test -s "$CANDIDATE_ROOT/candidates/composer.lock"
          test -s "$CANDIDATE_ROOT/candidates/package-lock.json"

          test "$(sha256sum "$CANDIDATE_ROOT/candidates/composer.lock" | awk '{print $1}')" = 'a96e562048532b4d9773877cea6c8dc0dd2a1adff52c25b7481493402beeced8'
          test "$(sha256sum "$CANDIDATE_ROOT/candidates/package-lock.json" | awk '{print $1}')" = 'ad3e1dd0300ef0796865fa78ed63e547090940360925efd8939f43966f3ed804'

          mkdir -p storage/app/nexora/dependency-intake
          cp -a "$CANDIDATE_ROOT/candidates" storage/app/nexora/dependency-intake/

          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('storage/app/nexora/dependency-intake/candidates/candidate.json').read_text())
          assert p['status'] == 'review-required'
          assert p['reproducible'] is True
          assert p['reproduction']['exact_match'] is True
          assert p['supply_chain']['status'] == 'pass'
          assert p['supply_chain']['exact_match'] is True
          assert p['source_tree_sha256'] == 'bfb821dc65afc1bcd8bce2ed2209c91871618866c2e18f8aa07481ad7ccae45d'
          assert p['toolchain_fingerprint_sha256'] == '8d713101071ed36ab1dc851e293019a03a89edd8dae5e40a2d0a002e0f6c5143'
          assert p['supply_chain_fingerprint_sha256'] == '8bf2ddabaa59d25adbca3d36743eedb4612d9edf6904bd6faeb810df0021325b'
          assert p['candidate_hashes']['composer_lock_sha256'] == 'a96e562048532b4d9773877cea6c8dc0dd2a1adff52c25b7481493402beeced8'
          assert p['candidate_hashes']['package_lock_sha256'] == 'ad3e1dd0300ef0796865fa78ed63e547090940360925efd8939f43966f3ed804'
          assert not p['validation']['errors']
          assert not p['validation']['warnings']
          print('Exact reviewed candidate identity verified.')
          PY

      - name: Verify AI-review exception is exact and scoped
        shell: bash
        run: |
          set -euo pipefail
          test -s .ai/plans/issue-52-ai-lock-review-exception.md
          grep -F 'AI:GPT-5.6-Sol@ChatGPT' .ai/plans/issue-52-ai-lock-review-exception.md
          grep -F '10112569527' .ai/plans/issue-52-ai-lock-review-exception.md
          grep -F 'a96e562048532b4d9773877cea6c8dc0dd2a1adff52c25b7481493402beeced8' .ai/plans/issue-52-ai-lock-review-exception.md
          grep -F 'ad3e1dd0300ef0796865fa78ed63e547090940360925efd8939f43966f3ed804' .ai/plans/issue-52-ai-lock-review-exception.md
          if grep -Fq 'HUMAN LOCK REVIEW PASS — reviewer=' .ai/plans/issue-52-ai-lock-review-exception.md; then
            echo 'Human attestation must not be fabricated by this exception.' >&2
            exit 1
          fi

      - name: Promote exact AI-reviewed lock pair fail-closed
        shell: bash
        run: |
          set -euo pipefail
          test ! -e composer.lock
          test ! -e package-lock.json
          php scripts/dependency-lock-promote.php \
            '--reviewer=AI:GPT-5.6-Sol@ChatGPT' \
            --confirm=PROMOTE-REVIEWED \
            --json | tee storage/app/nexora/dependency-intake/ai-promotion.stdout.json

      - name: Verify promoted exact bytes and reviewed attestation
        shell: bash
        run: |
          set -euo pipefail
          COMPOSER_SHA="$(sha256sum composer.lock | awk '{print $1}')"
          NPM_SHA="$(sha256sum package-lock.json | awk '{print $1}')"
          test "$COMPOSER_SHA" = 'a96e562048532b4d9773877cea6c8dc0dd2a1adff52c25b7481493402beeced8'
          test "$NPM_SHA" = 'ad3e1dd0300ef0796865fa78ed63e547090940360925efd8939f43966f3ed804'
          php scripts/dependency-contract-verify.php --strict-locks
          php scripts/dependency-lock-review.php --verify-attestation --require-refresh-handoff --json \
            | tee storage/app/nexora/dependency-intake/ai-reviewed-lock-verify.json

          python - <<'PY'
          import json
          from pathlib import Path
          review = json.loads(Path('storage/app/nexora/dependency-intake/reviewed-locks.json').read_text())
          assert review['status'] == 'reviewed'
          assert review['reviewer'] == 'AI:GPT-5.6-Sol@ChatGPT'
          assert review['composer_lock_sha256'] == 'a96e562048532b4d9773877cea6c8dc0dd2a1adff52c25b7481493402beeced8'
          assert review['package_lock_sha256'] == 'ad3e1dd0300ef0796865fa78ed63e547090940360925efd8939f43966f3ed804'
          promotion = json.loads(Path('storage/app/nexora/dependency-intake/lock-promotion.json').read_text())
          assert promotion['status'] == 'reviewed-promoted'
          assert promotion['reviewer'] == 'AI:GPT-5.6-Sol@ChatGPT'
          assert not promotion['errors']
          assert promotion['root_hashes_after']['composer_lock_sha256'] == review['composer_lock_sha256']
          assert promotion['root_hashes_after']['package_lock_sha256'] == review['package_lock_sha256']
          print('AI-reviewed promotion attestation and exact root bytes verified.')
          PY

      - name: Replay promoted npm lock and certify frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules public/build
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run test
          npm run build
          npm run verify:build

      - name: Upload exact promoted lock/evidence dossier
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexora-ai-reviewed-lock-promotion-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            composer.lock
            package-lock.json
            storage/app/nexora/dependency-intake/candidates/candidate.json
            storage/app/nexora/dependency-intake/lock-promotion.json
            storage/app/nexora/dependency-intake/lock-promotion-journal.json
            storage/app/nexora/dependency-intake/lock-refresh.json
            storage/app/nexora/dependency-intake/reviewed-locks.json
            storage/app/nexora/dependency-intake/ai-promotion.stdout.json
            storage/app/nexora/dependency-intake/ai-reviewed-lock-verify.json
            storage/app/nexora/dependency-intake/promotion-runs/**/summary.json
            storage/app/nexora/dependency-intake/promotion-runs/**/candidate-supply-chain.json
            storage/app/nexora/certification/build-assets.json
            public/build/manifest.json
