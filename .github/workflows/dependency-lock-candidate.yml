name: Nexora dependency lock candidate evidence

on:
  pull_request:
    paths:
      - '.github/workflows/dependency-lock-candidate.yml'
      - 'composer.json'
      - 'package.json'
      - 'scripts/dependency-lock-refresh.php'
      - 'scripts/lib/dependency-lock-intake.php'
      - 'scripts/lib/dependency-toolchain.php'
      - 'scripts/lib/dependency-candidate-supply-chain.php'
      - 'config/nexora-dependencies.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: dependency-lock-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact candidate checkout verified: $ACTUAL_SHA"

      - name: PHP 8.4 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Use repository-declared npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2 --no-audit --no-fund
          test "$(npm --version)" = "10.9.2"

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          php --version | head -n 1
          composer --version --no-ansi
          node --version
          npm --version

      - name: Narrow Vitest versus older Vite peer graph
        shell: bash
        run: |
          set -uo pipefail
          DIAG_ROOT="$GITHUB_WORKSPACE/storage/app/nexora/dependency-intake/npm-peer-diagnostics"
          CACHE_ROOT="$GITHUB_WORKSPACE/storage/app/nexora/tools/npm-diagnostic-cache"
          rm -rf "$DIAG_ROOT" "$CACHE_ROOT"
          mkdir -p "$DIAG_ROOT" "$CACHE_ROOT"
          printf 'case\tvite_action\tvitest_action\texit_code\tlock_sha256\n' > "$DIAG_ROOT/results.tsv"

          run_case() {
            local name="$1"
            local vite_action="$2"
            local vitest_action="$3"
            local dir="$DIAG_ROOT/$name"
            mkdir -p "$dir"
            cp package.json "$dir/package.json"
            node - "$dir/package.json" "$vite_action" "$vitest_action" <<'NODE'
          const fs = require('node:fs')
          const [path, viteAction, vitestAction] = process.argv.slice(2)
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          if (viteAction && viteAction !== '__keep__') manifest.devDependencies.vite = viteAction
          if (vitestAction === '__remove__') delete manifest.devDependencies.vitest
          else if (vitestAction && vitestAction !== '__keep__') manifest.devDependencies.vitest = vitestAction
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          NODE
            set +e
            (
              cd "$dir"
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
                --cache "$CACHE_ROOT/$name"
            ) >"$dir/stdout.log" 2>"$dir/stderr.log"
            local rc=$?
            set -e
            local lock_sha=""
            if [ -s "$dir/package-lock.json" ]; then
              lock_sha="$(sha256sum "$dir/package-lock.json" | awk '{print $1}')"
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$vite_action" "$vitest_action" "$rc" "$lock_sha" \
              >> "$DIAG_ROOT/results.tsv"
          }

          run_case without-vitest __keep__ __remove__
          run_case vite-8.0.6 8.0.6 __keep__
          run_case vite-8.0.6-without-vitest 8.0.6 __remove__
          cat "$DIAG_ROOT/results.tsv"

      - name: Generate double-run reproducible lock candidate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p storage/app/nexora/dependency-intake
          set +e
          php scripts/dependency-lock-refresh.php --confirm=REFRESH --json > storage/app/nexora/dependency-intake/lock-refresh.json
          RC=$?
          set -e
          cat storage/app/nexora/dependency-intake/lock-refresh.json
          if [ -s storage/app/nexora/dependency-intake/candidates/composer.lock ] && \
             [ -s storage/app/nexora/dependency-intake/candidates/package-lock.json ]; then
            sha256sum \
              storage/app/nexora/dependency-intake/candidates/composer.lock \
              storage/app/nexora/dependency-intake/candidates/package-lock.json \
              > storage/app/nexora/dependency-intake/candidate-sha256.txt
          fi
          if [ "$RC" -ne 2 ]; then
            echo "Lock refresh did not reach review-required state (exit=$RC)." >&2
            exit "$RC"
          fi
          test -s storage/app/nexora/dependency-intake/candidates/composer.lock
          test -s storage/app/nexora/dependency-intake/candidates/package-lock.json
          test -s storage/app/nexora/dependency-intake/lock-refresh.md
          test -s storage/app/nexora/dependency-intake/candidate-sha256.txt

      - name: Upload review-only candidate dossier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-dependency-lock-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            storage/app/nexora/dependency-intake/candidates/composer.lock
            storage/app/nexora/dependency-intake/candidates/package-lock.json
            storage/app/nexora/dependency-intake/lock-refresh.md
            storage/app/nexora/dependency-intake/lock-refresh.json
            storage/app/nexora/dependency-intake/candidate-sha256.txt
            storage/app/nexora/dependency-intake/npm-peer-diagnostics/results.tsv
            storage/app/nexora/dependency-intake/npm-peer-diagnostics/*/package.json
            storage/app/nexora/dependency-intake/npm-peer-diagnostics/*/package-lock.json
            storage/app/nexora/dependency-intake/npm-peer-diagnostics/*/stdout.log
            storage/app/nexora/dependency-intake/npm-peer-diagnostics/*/stderr.log
            storage/app/nexora/tools/npm-diagnostic-cache/*/_logs/*-debug-0.log
            storage/app/nexora/tools/npm-cache/_logs/*-debug-0.log
