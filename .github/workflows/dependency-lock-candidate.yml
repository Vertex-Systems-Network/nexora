name: Nexora dependency lock candidate evidence

on:
  pull_request:
    paths:
      - '.github/workflows/dependency-lock-candidate.yml'
      - 'composer.json'
      - 'package.json'
      - 'scripts/dependency-lock-refresh.php'
      - 'scripts/lib/dependency-lock-intake.php'
      - 'scripts/lib/dependency-toolchain.php'
      - 'scripts/lib/dependency-candidate-supply-chain.php'
      - 'config/nexora-dependencies.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: dependency-lock-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact candidate checkout verified: $ACTUAL_SHA"

      - name: PHP 8.4 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Use repository-declared npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2 --no-audit --no-fund
          test "$(npm --version)" = "10.9.2"

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          php --version | head -n 1
          composer --version --no-ansi
          node --version
          npm --version

      - name: Certify installed Vitest 5 lock replay on current Vite 8 stack
        shell: bash
        run: |
          set -uo pipefail
          CANDIDATE_ROOT="$GITHUB_WORKSPACE/storage/app/nexora/dependency-intake/vitest-5-installed-lock-candidate"
          CACHE_ROOT="$GITHUB_WORKSPACE/storage/app/nexora/tools/npm-candidate-cache"
          rm -rf "$CANDIDATE_ROOT" "$CACHE_ROOT" node_modules package-lock.json
          mkdir -p "$CANDIDATE_ROOT" "$CACHE_ROOT"
          cp package.json "$CANDIDATE_ROOT/package.original.json"

          node - package.json <<'NODE'
          const fs = require('node:fs')
          const path = process.argv[2]
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.devDependencies.vitest = '5.0.0'
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          NODE

          run_and_record() {
            local name="$1"
            shift
            set +e
            "$@" >"$CANDIDATE_ROOT/$name.stdout.log" 2>"$CANDIDATE_ROOT/$name.stderr.log"
            local rc=$?
            set -e
            printf '%s\t%s\n' "$name" "$rc" >> "$CANDIDATE_ROOT/results.tsv"
            return "$rc"
          }

          printf 'gate\texit_code\n' > "$CANDIDATE_ROOT/results.tsv"
          overall=0
          run_and_record install-lock npm install --ignore-scripts --no-audit --no-fund --cache "$CACHE_ROOT" || overall=1
          if [ -s package-lock.json ]; then
            cp package.json "$CANDIDATE_ROOT/package.json"
            cp package-lock.json "$CANDIDATE_ROOT/package-lock.json"
            sha256sum package.json package-lock.json > "$CANDIDATE_ROOT/sha256.txt"
            node - package-lock.json > "$CANDIDATE_ROOT/rolldown-bindings.txt" <<'NODE'
          const fs = require('node:fs')
          const lock = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          for (const [path, meta] of Object.entries(lock.packages || {})) {
            if (path.includes('@rolldown/binding-') || path === 'node_modules/rolldown') {
              console.log(`${path}\t${meta.version || ''}`)
            }
          }
          NODE
          else
            overall=1
          fi

          rm -rf node_modules
          if [ "$overall" -eq 0 ]; then
            run_and_record ci-replay npm ci --no-audit --no-fund --cache "$CACHE_ROOT" || overall=1
          fi
          if [ "$overall" -eq 0 ]; then
            run_and_record typecheck npm run typecheck || overall=1
          fi
          if [ "$overall" -eq 0 ]; then
            run_and_record test npm run test || overall=1
          fi
          if [ "$overall" -eq 0 ]; then
            run_and_record build npm run build || overall=1
          fi
          if [ "$overall" -eq 0 ]; then
            run_and_record verify-build npm run verify:build || overall=1
          fi

          git checkout -- package.json
          rm -f package-lock.json
          rm -rf node_modules
          cat "$CANDIDATE_ROOT/results.tsv"
          cat "$CANDIDATE_ROOT/rolldown-bindings.txt" 2>/dev/null || true
          test "$overall" -eq 0

      - name: Confirm unchanged current manifest remains governed-blocked
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p storage/app/nexora/dependency-intake
          set +e
          php scripts/dependency-lock-refresh.php --confirm=REFRESH --json > storage/app/nexora/dependency-intake/lock-refresh.json
          RC=$?
          set -e
          cat storage/app/nexora/dependency-intake/lock-refresh.json
          if [ -s storage/app/nexora/dependency-intake/candidates/composer.lock ] && \
             [ -s storage/app/nexora/dependency-intake/candidates/package-lock.json ]; then
            sha256sum \
              storage/app/nexora/dependency-intake/candidates/composer.lock \
              storage/app/nexora/dependency-intake/candidates/package-lock.json \
              > storage/app/nexora/dependency-intake/candidate-sha256.txt
          fi
          if [ "$RC" -ne 2 ]; then
            echo "Current manifest remains blocked as expected for Issue #52 (exit=$RC)." >&2
            exit "$RC"
          fi
          test -s storage/app/nexora/dependency-intake/candidates/composer.lock
          test -s storage/app/nexora/dependency-intake/candidates/package-lock.json
          test -s storage/app/nexora/dependency-intake/lock-refresh.md
          test -s storage/app/nexora/dependency-intake/candidate-sha256.txt

      - name: Upload review-only candidate dossier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-dependency-lock-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            storage/app/nexora/dependency-intake/vitest-5-installed-lock-candidate/package.original.json
            storage/app/nexora/dependency-intake/vitest-5-installed-lock-candidate/package.json
            storage/app/nexora/dependency-intake/vitest-5-installed-lock-candidate/package-lock.json
            storage/app/nexora/dependency-intake/vitest-5-installed-lock-candidate/sha256.txt
            storage/app/nexora/dependency-intake/vitest-5-installed-lock-candidate/rolldown-bindings.txt
            storage/app/nexora/dependency-intake/vitest-5-installed-lock-candidate/results.tsv
            storage/app/nexora/dependency-intake/vitest-5-installed-lock-candidate/*.stdout.log
            storage/app/nexora/dependency-intake/vitest-5-installed-lock-candidate/*.stderr.log
            storage/app/nexora/dependency-intake/candidates/composer.lock
            storage/app/nexora/dependency-intake/candidates/package-lock.json
            storage/app/nexora/dependency-intake/lock-refresh.md
            storage/app/nexora/dependency-intake/lock-refresh.json
            storage/app/nexora/dependency-intake/candidate-sha256.txt
            storage/app/nexora/tools/npm-candidate-cache/_logs/*-debug-0.log
            storage/app/nexora/tools/npm-cache/_logs/*-debug-0.log
