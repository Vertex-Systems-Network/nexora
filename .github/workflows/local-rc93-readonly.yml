name: Nexora rc93 source marker diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc93-source-marker-diagnosis:
    name: rc93-source-marker-diagnosis
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    steps:
      - name: Compare preserved rc93 recovery markers without exposing source
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $target = 'D:\laragon\www\nexora'
          if (!(Test-Path "$target\artisan")) {
            Write-Error "Preserved Nexora target was not found at the configured local path."
            exit 1
          }

          Set-Location $target

          $controllerPath = Join-Path $target 'app\Http\Controllers\Install\InstallerController.php'
          $handoffPath = Join-Path $target 'app\Nexora\Installation\RuntimePostInstallHandoff.php'
          $routesPath = Join-Path $target 'routes\web.php'

          foreach ($path in @($controllerPath,$handoffPath,$routesPath)) {
            if (!(Test-Path $path)) {
              Write-Error "Required rc93 recovery source file missing."
              exit 2
            }
          }

          $controller = Get-Content -Raw $controllerPath
          $handoff = Get-Content -Raw $handoffPath
          $routes = Get-Content -Raw $routesPath

          $markers = [ordered]@{
            route_runtime_handoff = $routes.Contains("/runtime-handoff")
            controller_runtime_handoff_method = $controller.Contains("function runtimeHandoff")
            controller_calls_verify_and_record = $controller.Contains("postInstallHandoff->verifyAndRecord()")
            controller_rechecks_handoff = $controller.Contains("postInstallHandoff->inspect()")
            handoff_finalize_method = $handoff.Contains("function finalizeCommittedRuntimeIdentity")
            handoff_verify_and_record_calls_finalize = ($handoff.Contains("verifyAndRecord") -and $handoff.Contains("finalizeCommittedRuntimeIdentity();"))
            handoff_forgets_deployment_identity = $handoff.Contains("forgetMemoizedIdentity")
            handoff_adopts_activation_epoch = $handoff.Contains("adoptCurrentEpochForProcess")
            handoff_finalized_metadata_flag = $handoff.Contains("post_install_identity_finalized")
            handoff_allowed_four_planes = ($handoff.Contains("'environment'") -and $handoff.Contains("'activation'") -and $handoff.Contains("'service'") -and $handoff.Contains("'process'"))
          }

          Write-Host "Runner: $env:RUNNER_NAME / $env:RUNNER_OS / $env:RUNNER_ARCH"
          foreach ($entry in $markers.GetEnumerator()) {
            Write-Host "$($entry.Key)=$($entry.Value)"
          }

          exit 0
