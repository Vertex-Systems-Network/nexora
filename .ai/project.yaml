schema_version: "1.0"
project: Nexora
product_class: advanced extensible web platform / CMS / site builder / application ecosystem
mission: >-
  Build a secure, extensible, self-hostable and optionally managed AI-native web platform that
  combines and advances the strongest ideas from WordPress, Webflow, Wix, Shopify, Framer,
  component-driven visual builders and enterprise SaaS while using evidence-driven quality,
  formal data governance, reliability engineering, an explainable System Graph, governed
  AI-native development orchestration and strict financial/payment boundaries. Themes,
  extensions, apps, integrations, product AI agents and development AI agents may not bypass
  Nexora public contracts, capabilities, tenancy, planning governance, evidence authority,
  performance, reliability, graph evidence or security boundaries.

