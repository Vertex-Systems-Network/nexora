schema_version: "1.0"
project: Nexora
product_class: advanced extensible web platform / CMS / site builder / application ecosystem
mission: >-
  Build a secure, extensible, self-hostable and optionally managed AI-native web platform that
  combines and advances the strongest ideas from WordPress, Webflow, Wix, Shopify, Framer,
  component-driven visual builders and enterprise SaaS while using evidence-driven quality,
  formal data governance, reliability engineering, an explainable System Graph and strict
  financial/payment boundaries. Themes, extensions, apps, integrations and AI agents may not
  bypass Nexora public contracts, capabilities, tenancy, publishing semantics, data policies,
  planning governance, performance, reliability, graph evidence or security boundaries.

